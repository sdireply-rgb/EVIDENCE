async function syncDolibarrProductsPush(){
  const candidates = db.products.filter(p=>!p.dolibarrId && p.nom);
  let created=0, fail=0;
  for(const p of candidates){
    try{
      const payload = {
        ref: p.ref && p.ref.trim() ? p.ref.trim() : ('LOC-'+p.id).toUpperCase(),
        label: p.nom,
        price: p.prix || 0,
        price_base_type: 'HT',
        tva_tx: p.tva || 0,
        type: 0 // 0 = produit, 1 = service côté Dolibarr ; par défaut "produit" (à ajuster si le local doit distinguer)
      };
      const newId = await dolFetch('/products', { method:'POST', body: payload });
      p.dolibarrId = String(newId);
      created++;
    }catch(e){ fail++; dolLog('err', `Produit "${p.nom}" non créé côté Dolibarr (${e.message}).`); }
  }
  save();
  return { created, fail };
}

/* ---- Soir : pousse un contrat (pièces jointes vers un contrat Dolibarr existant, ou création auto) ----
   Attention : la création automatique de contrat par l'API Dolibarr est connue pour être instable
   selon les versions/serveurs. Si le contrat existe déjà côté Dolibarr, renseigne sa référence dans
   la fiche du contrat local (champ "Référence contrat Dolibarr") : la synchro déposera alors les pièces
   jointes directement dessus sans tenter de créer un nouveau contrat. */
async function pushContractToDolibarr(ct){
  const contact = db.contacts.find(c=>c.id===ct.contactId);
  if(!contact) throw new Error(`${ct.number} : aucun acheteur associé, transfert impossible.`);

  let dolRef = (ct.dolibarrRef||'').trim();
  let newId = ct.dolibarrId || null;

  if(!dolRef){
    // pas de référence fournie : on tente de créer le contrat automatiquement côté Dolibarr
    const socid = await ensureDolibarrThirdParty(contact);
    const header = {
      socid: Number(socid),
      ref_customer: ct.number,
      date_contrat: Math.floor(new Date(ct.date).getTime()/1000),
      note_public: ct.objet || ''
    };
    newId = await dolFetch('/contracts', { method:'POST', body: header });
    try{
      await dolFetch(`/contracts/${newId}/lines`, { method:'POST', body:{
        desc: ct.objet || ct.number, qty: 1, subprice: ct.montant||0, tva_tx: 0
      }});
    }catch(e){ dolLog('info', `${ct.number} : ligne de contrat non ajoutée (${e.message}).`); }
    try{
      const detail = await dolFetch(`/contracts/${newId}`);
      if(detail && detail.ref) dolRef = detail.ref;
    }catch(e){ /* on retentera l'upload avec l'id brut si besoin */ }
    if(!dolRef) dolRef = String(newId);
    if(ct.status==='signe'){
      try{ await dolFetch(`/contracts/${newId}/validate`, { method:'POST', body:{ notrigger:0 } }); }
      catch(e){ dolLog('info', `${ct.number} : contrat Dolibarr créé mais non validé (${e.message}).`); }
    }
  }

  // dépôt des pièces jointes (CNI, photos, signatures) sur le contrat Dolibarr identifié par dolRef
  const attachments = [];
  if(ct.photos){
    if(ct.photos.cni_recto) attachments.push({name:'CNI_recto.'+dataUrlExt(ct.photos.cni_recto), data:ct.photos.cni_recto});
    if(ct.photos.cni_verso) attachments.push({name:'CNI_verso.'+dataUrlExt(ct.photos.cni_verso), data:ct.photos.cni_verso});
    (ct.photos.gallery||[]).forEach((p,i)=> attachments.push({name:`photo_${i+1}.`+dataUrlExt(p), data:p}));
  }
  if(ct.signatures){
    if(ct.signatures.vendeur) attachments.push({name:'signature_vendeur.png', data:ct.signatures.vendeur});
    if(ct.signatures.client) attachments.push({name:'signature_acheteur.png', data:ct.signatures.client});
  }
  let uploaded=0, uploadFail=0;
  for(const att of attachments){
    try{ await uploadDolibarrDocument(dolRef, att.name, att.data); uploaded++; }
    catch(e){ uploadFail++; dolLog('err', `${ct.number} : pièce jointe "${att.name}" non envoyée sur le contrat Dolibarr ${dolRef} (${e.message}).`); }
  }

  ct.dolibarrRef = dolRef;
  if(newId) ct.dolibarrId = String(newId);
  ct.dolibarrSynced = true;
  ct.dolibarrSyncedAt = new Date().toISOString();
  save();
  return { ref: dolRef, uploaded, uploadFail };
}

/* ---- Soir : transfère tout ce qui n'est pas encore synchronisé pour une date donnée ---- */
async function syncDolibarrEvening(dateISO){
  dateISO = dateISO || todayISO();
  dolLog('info', `Synchro soir — transfert des documents du ${dateISO}...`);
  // 0) on pousse d'abord vers Dolibarr les contacts créés localement et pas encore liés
  const contactsPush = await syncDolibarrContactsPush().catch(e=>{ dolLog('err','Échec envoi des nouveaux contacts : '+e.message); return {created:0, fail:0}; });
  // 0bis) on pousse aussi les nouveaux produits/services créés localement et pas encore liés
  const productsPush = await syncDolibarrProductsPush().catch(e=>{ dolLog('err','Échec envoi des nouveaux produits/services : '+e.message); return {created:0, fail:0}; });
  // 0ter) on pousse aussi les nouveaux rendez-vous créés localement dans Evidence et pas encore liés
  const appointmentsPush = await syncDolibarrAppointmentsPush().catch(e=>{ dolLog('err','Échec envoi des nouveaux rendez-vous : '+e.message); return {created:0, fail:0}; });
  const devisFactures = db.documents.filter(d=>d.date===dateISO && (d.type==='devis'||d.type==='facture') && !d.dolibarrSynced);
  const bl = db.documents.filter(d=>d.date===dateISO && d.type==='bl' && !d.dolibarrSynced);
  const livraisonsAProuver = db.documents.filter(d=>d.type==='bl' && d.dolibarrId && ['paye','refuse','absent','reporte'].includes(d.status) && d.dolibarrLastPushedStatus!==d.status);
  const facturesAPayer = db.documents.filter(d=>d.type==='facture' && d.dolibarrId && d.status==='paye' && d.dolibarrLastPushedStatus!=='paye');
  const interventions = db.interventions.filter(it=>interventionNeedsPush(it));
  const contrats = db.contracts.filter(c=>c.date===dateISO && !c.dolibarrSynced);
  let ok=0, fail=0;
  for(const d of devisFactures){
    try{ await pushDocToDolibarr(d); dolLog('ok', `${d.number} transféré vers Dolibarr.`); ok++; }
    catch(e){ dolLog('err', `${d.number} : ${e.message}`); fail++; }
  }
  for(const d of bl){
    try{ await pushBLToDolibarr(d); dolLog('ok', `${d.number} transféré vers Dolibarr (commande + expédition).`); ok++; }
    catch(e){ dolLog('err', `${d.number} : ${e.message}`); fail++; }
  }
  for(const d of livraisonsAProuver){
    try{
      await pushDeliveryProofToDolibarr(d);
      const msg = d.status==='refuse' ? 'refus répercuté sur Dolibarr' : d.status==='absent' ? 'absence répercutée sur Dolibarr' : d.status==='reporte' ? 'report répercuté sur Dolibarr' : 'livraison confirmée, preuve déposée sur Dolibarr';
      dolLog('ok', `${d.number} : ${msg}.`);
      ok++;
    }
    catch(e){ dolLog('err', `${d.number} : ${e.message}`); fail++; }
  }
  for(const d of facturesAPayer){
    try{
      const r = await pushInvoicePaymentToDolibarr(d);
      dolLog('ok', r.alreadyPaid ? `${d.number} : déjà soldée côté Dolibarr, synchro juste marquée à jour.` : `${d.number} : règlement déposé sur Dolibarr, facture marquée payée.`);
      ok++;
    }
    catch(e){ dolLog('err', `${d.number} : ${e.message}`); fail++; }
  }
  for(const it of interventions){
    try{ await pushInterventionToDolibarr(it); dolLog('ok', `${it.number} transférée vers Dolibarr.`); ok++; }
    catch(e){ dolLog('err', `${it.number} : ${e.message}`); fail++; }
  }
  for(const c of contrats){
    try{
      const r = await pushContractToDolibarr(c);
      dolLog('ok', `${c.number} : pièces jointes déposées sur le contrat Dolibarr ${r.ref} (${r.uploaded} envoyée(s)${r.uploadFail?', '+r.uploadFail+' échec(s)':''}).`);
      ok++;
    }catch(e){ dolLog('err', `${c.number} : ${e.message}`); fail++; }
  }
  if(db.dolibarr.autoCreateThirdParty===undefined) db.dolibarr.autoCreateThirdParty = true;
  db.dolibarr.lastEveningSync = new Date().toISOString();
  save();
  dolLog('info', `Synchro soir terminée : ${contactsPush.created} nouveau(x) contact(s) envoyé(s) vers Dolibarr, ${productsPush.created} nouveau(x) produit(s)/service(s) envoyé(s), ${appointmentsPush.created} rendez-vous envoyé(s), ${appointmentsPush.removedDone||0} RDV terminé(s) retiré(s) d'Evidence, ${ok} document(s)/contrat(s) transféré(s), ${fail} échec(s).`);
  return { ok, fail, contactsPush, productsPush, appointmentsPush };
}

/* ============================================================
   IMPORT HISTORIQUE COMPLET — factures, devis et RDV existants dans
   Dolibarr depuis toujours (pas seulement ceux du jour). Contrairement à
   la "Synchro matin" (RDV du jour uniquement) et à la synchro soir (qui ne
   fait que POUSSER les documents créés localement), ces fonctions VONT
   CHERCHER dans Dolibarr tout l'historique déjà existant et l'importent
   dans le CRM local, avec pagination pour couvrir un très gros volume.
   ============================================================ */

/* ---- Import de toutes les factures Dolibarr existantes (depuis le tout début) ---- */
async function syncDolibarrInvoicesPull(){
  dolLog('info', `Import historique — récupération de toutes les factures Dolibarr...`);
  try{
    let all = [];
    let page = 0;
    const limit = 200;
    while(true){
      const batch = await dolFetch(`/invoices?sortfield=t.rowid&sortorder=ASC&limit=${limit}&page=${page}`);
      const arr = Array.isArray(batch) ? batch : [];
      all = all.concat(arr);
      if(arr.length < limit) break;
      page++;
      if(page>300) break; // sécurité anti-boucle
    }
    let added=0, updated=0;
    for(const inv of all){
      if(!inv || !inv.id) continue;
      const existing = db.documents.find(d=>d.type==='facture' && d.dolibarrId===String(inv.id));
      const c = inv.socid ? db.contacts.find(c=>c.dolibarrId===String(inv.socid)) : null;
      const { date } = dolUnixToISO(inv.date || inv.datef || inv.date_creation);
      const invLines = (Array.isArray(inv.lines) ? inv.lines : []).map(l=>({
        desc: l.desc || l.label || l.product_label || 'Ligne',
        qty: Number(l.qty)||0, price: Number(l.subprice)||0, tva: Number(l.tva_tx)||0
      }));
      const statut = Number(inv.status!==undefined ? inv.status : inv.statut);
      const estPayee = Number(inv.paye)===1 || statut===2;
      const status = estPayee ? 'paye' : (statut>=1 ? 'envoye' : 'brouillon');

      if(existing){
        // on ne réimporte pas par-dessus une facture déjà marquée payée localement
        if(existing.status!=='paye' && status!==existing.status){ existing.status = status; updated++; }
        continue;
      }
      const doc = {
        id: uid(), type:'facture', number: inv.ref || nextNumber('facture'),
        date: date || todayISO(), contactId: c ? c.id : '',
        clientLabel: (inv.thirdparty && inv.thirdparty.name) || inv.socname || '',
        status, source:'dolibarr', notes: inv.note_public || '',
        lines: invLines.length ? invLines : [{desc:'Facture '+(inv.ref||inv.id), qty:1, price:Number(inv.total_ht)||0, tva:0}],
        dolibarrId: String(inv.id), dolibarrRef: inv.ref || String(inv.id),
        dolibarrSynced:true, dolibarrSyncedAt:new Date().toISOString()
      };
      db.documents.push(doc);
      added++;
    }
    save();
    db.dolibarr.lastInvoicesPull = new Date().toISOString();
    save();
    dolLog('ok', `Import historique factures terminé : ${added} nouvelle(s) facture(s) importée(s), ${updated} mise(s) à jour (${all.length} facture(s) trouvée(s) côté Dolibarr).`);
    return { added, updated, total: all.length };
  }catch(e){
    dolLog('err', 'Échec import historique factures : '+e.message);
    throw e;
  }
}

    const limit = 200;
    while(true){
      const batch = await dolFetch(`/agendaevents?sortfield=t.id&sortorder=ASC&limit=${limit}&page=${page}`);
      const arr = Array.isArray(batch) ? batch : [];
      all = all.concat(arr);
      if(arr.length < limit) break;
      page++;
      if(page>300) break; // sécurité anti-boucle
    }
    let added=0, skipped=0, removedDone=0;
    all.forEach(ev=>{
      if(!ev || !ev.id) return;
      if(!isRealClientAppointment(ev)) return; // on ne garde que les vrais RDV clients (type AC_RDV / lié à un tiers), pas les événements système (facture validée, etc.)
      const isDone = ev.percentage>=100;
      const already = db.appointments.find(a=>a.dolibarrId===String(ev.id));
      if(already){
        // RDV déjà présent en local mais marqué terminé côté Dolibarr depuis : on le retire d'Evidence,
        // il reste consultable uniquement dans l'agenda Dolibarr.
        if(isDone){ db.appointments = db.appointments.filter(a=>a.id!==already.id); removedDone++; }
        else{ skipped++; }
        return;
      }
      // On n'importe pas les RDV déjà terminés côté Dolibarr : Evidence ne doit contenir que les RDV actifs.
      if(isDone){ removedDone++; return; }
      const { date, heure } = dolUnixToISO(ev.datep);
      let contactId = '';
      if(ev.socid){
        const c = db.contacts.find(c=>c.dolibarrId===String(ev.socid));
        if(c) contactId = c.id;
      }
      db.appointments.push({
        id: uid(),
        dolibarrId: String(ev.id),
        source: 'dolibarr',
        date: date || todayISO(),
        heure: heure || '09:00',
        duree: 30,
        contactId,
        clientLabel: ev.socname || ev.contact || '',
        objet: ev.label || 'RDV Dolibarr',
        titre: ev.label || 'RDV Dolibarr',
        lieu: '',
        notes: ev.note_public || ev.note_private || '',
        status: 'planifie'
      });
      added++;
    });
    save();
    db.dolibarr.lastAppointmentsPull = new Date().toISOString();
    save();
    dolLog('ok', `Import historique RDV terminé : ${added} nouveau(x) RDV importé(s), ${skipped} déjà présent(s), ${removedDone} terminé(s) retiré(s)/ignoré(s) d'Evidence (${all.length} RDV trouvé(s) côté Dolibarr).`);
    return { added, skipped, removedDone, total: all.length };
  }catch(e){
    dolLog('err', 'Échec import historique RDV : '+e.message);
    throw e;
  }
}

/* ---- Lance les trois imports historiques d'un coup (clients d'abord, pour bien relier les documents/RDV) ---- */
async function syncDolibarrFullHistoryPull(){
  dolLog('info', `Import de l'historique complet Dolibarr démarré (factures, devis et RDV depuis le début)...`);
  const contactsResult = await syncDolibarrContacts().catch(e=>({ added:0, updated:0, error:e.message }));
  const invoicesResult = await syncDolibarrInvoicesPull().catch(e=>({ added:0, updated:0, error:e.message }));
  const proposalsResult = await syncDolibarrProposalsPull().catch(e=>({ added:0, updated:0, error:e.message }));
  const appointmentsResult = await syncDolibarrAppointmentsPull().catch(e=>({ added:0, skipped:0, error:e.message }));
  dolLog('ok', `Import historique complet terminé.`);
  return { contacts: contactsResult, invoices: invoicesResult, proposals: proposalsResult, appointments: appointmentsResult };
}

/* ============================================================
   TICKET Z — clôture détaillée (devis, factures, BL, interventions, RDV)
   ============================================================ */
function ticketZNextNumber(){
  db.counters.ticketz = (db.counters.ticketz||0)+1;
  const y = new Date().getFullYear();
  return `Z-${y}-${String(db.counters.ticketz).padStart(4,'0')}`;
}
function collectZData(dateStart, dateEnd){
  const inRange = (d)=> d && d>=dateStart && d<=dateEnd;
  const devis = db.documents.filter(d=>d.type==='devis' && inRange(d.date));
  const factures = db.documents.filter(d=>d.type==='facture' && inRange(d.date));
  const bl = db.documents.filter(d=>d.type==='bl' && inRange(d.date));
  const interventions = db.interventions.filter(it=>inRange(it.date));
  const appointments = db.appointments.filter(a=>inRange(a.date));
  const facturesValidees = factures.filter(d=>d.status!=='brouillon');
  const totalHT = facturesValidees.reduce((s,d)=>s+docTotals(d).ht,0);
  const totalTVA = facturesValidees.reduce((s,d)=>s+docTotals(d).tva,0);
  const totalTTC = facturesValidees.reduce((s,d)=>s+docTotals(d).ttc,0);
  const totalInterventions = interventions.reduce((s,it)=>s+interventionTotals(it).ttc,0);
  return { devis, factures, bl, interventions, appointments,
    totals:{ ht:totalHT, tva:totalTVA, ttc:totalTTC, interventionsTTC:totalInterventions } };
}
function buildDocSnapshotLine(d){
  const c = db.contacts.find(c=>c.id===d.contactId);
  return {
    number:d.number, client:c?c.nom:'—', date:d.date, status:d.status, notes:d.notes||'',
    lines:(d.lines||[]).map(l=>({desc:l.desc,qty:l.qty,price:l.price,tva:l.tva})),
    totals: docTotals(d)
  };
}
function buildInterventionSnapshotLine(it){
  const c = db.contacts.find(c=>c.id===it.contactId);
  return {
    number:it.number, client:c?c.nom:'—', date:it.date, heure:it.heure, technicien:it.technicien||'',
    description:it.description||'', dureeHeures:it.dureeHeures||0, status:it.status, notes:it.notes||'',
    lines:(it.lines||[]).map(l=>({desc:l.desc,qty:l.qty,price:l.price,tva:l.tva})),
    totals: interventionTotals(it),
    nbPhotosAvant:(it.photos?.avant||[]).length, nbPhotosApres:(it.photos?.apres||[]).length,
    signature: !!it.signatureClient
  };
}
function buildAppointmentSnapshotLine(a){
  const c = db.contacts.find(c=>c.id===a.contactId);
  return { date:a.date, heure:a.heure, client:c?c.nom:(a.clientLabel||'—'), titre:a.titre||'', status:a.status, notes:a.notes||'' };
}
function generateTicketZ(dateStart, dateEnd){
  const data = collectZData(dateStart, dateEnd);
  const z = {
    id: uid(), number: ticketZNextNumber(),
    dateStart, dateEnd, generatedAt: new Date().toISOString(),
    devis: data.devis.map(buildDocSnapshotLine),
    factures: data.factures.map(buildDocSnapshotLine),
    bl: data.bl.map(buildDocSnapshotLine),
    interventions: data.interventions.map(buildInterventionSnapshotLine),
    appointments: data.appointments.map(buildAppointmentSnapshotLine),
    totals: data.totals
  };
  db.ticketsZ.push(z);
  save();
  return z;
}

/* ---- Export PDF complet du Ticket Z (A4 multi-pages ou 101x152mm multi-pages) ---- */
function exportTicketZPdf(z, format){
  if(!z) return;
  const { jsPDF } = window.jspdf;
  const small = format==='label';
  const pageFormatArg = small ? [101,152] : 'a4';
  const doc = new jsPDF({ unit:'mm', format: pageFormatArg });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const margin = small ? 5 : 15;
  const bottomLimit = H - margin;
  const fs = (base)=> small ? Math.max(6, base-2) : base;
  let y = margin;
  function newPage(){ doc.addPage(pageFormatArg); y = margin; }
  function ensure(h){ if(y + h > bottomLimit){ newPage(); } }
  function text(str, x, opts){ doc.text(String(str), x, y, opts||{}); }
  function para(str, x, maxW, lineH){
    doc.splitTextToSize(str, maxW).forEach(line=>{ ensure(lineH); doc.text(line, x, y); y += lineH; });
  }
  function sectionTitle(t){
    ensure(small?6:9);
    doc.setDrawColor(22,26,35); doc.setLineWidth(small?0.6:0.8);
    doc.line(margin, y, W-margin, y); y+= small?3.5:5;
    doc.setFont('helvetica','bold'); doc.setFontSize(fs(small?9:11));
    text(t, margin); y+= small?4:6;
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(fs(13));
  text(db.company.nom || 'Société', margin); y+= small?4.5:6;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(8.5));
  (db.company.adresse||'').split('\n').forEach(l=>{ if(l.trim()){ text(l, margin); y+=small?3.4:4; }});
  if(db.company.siret){ text('SIRET: '+db.company.siret, margin); y+=small?3.4:4; }
  y += small?1.5:3;

  doc.setFont('helvetica','bold'); doc.setFontSize(fs(15));
  text('TICKET Z', margin); y+= small?5:7;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(9));
  text('N° '+z.number, margin); y+= small?3.6:5;
  text('Période : '+(z.dateStart===z.dateEnd? fmtDate(z.dateStart) : fmtDate(z.dateStart)+' → '+fmtDate(z.dateEnd)), margin); y+= small?3.6:5;
  text('Généré le : '+fmtDate(z.generatedAt)+' à '+new Date(z.generatedAt).toTimeString().slice(0,5), margin); y+= small?3.6:5;
  y += small?2:4;

  // ---- Récapitulatif chiffré ----
  sectionTitle('RÉCAPITULATIF');
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(9));
  [
    ['Devis émis', z.devis.length],
    ['Factures émises', z.factures.length],
    ['Bons de livraison', z.bl.length],
    ['Interventions', z.interventions.length],
    ['Rendez-vous', z.appointments.length],
  ].forEach(([label,val])=>{ ensure(small?3.4:4.5); text(label+' : '+val, margin); y+=small?3.4:4.5; });
  y += small?1:2;
  doc.setFont('helvetica','bold');
  ensure(small?3.6:5); text('Total facturé HT : '+fmtMoney(z.totals.ht), margin); y+=small?3.6:5;
  ensure(small?3.6:5); text('Total TVA collectée : '+fmtMoney(z.totals.tva), margin); y+=small?3.6:5;
  ensure(small?4:6); doc.setFontSize(fs(10.5)); text('TOTAL FACTURÉ TTC : '+fmtMoney(z.totals.ttc), margin); y+=small?4.5:6.5;
  doc.setFontSize(fs(9));
  ensure(small?3.6:5); text('Total pièces/prestations interventions TTC : '+fmtMoney(z.totals.interventionsTTC), margin); y+=small?4:6;
  doc.setFont('helvetica','normal');
  y += small?1:2;

  function docBlock(label, d){
    ensure(small?10:14);
    doc.setFont('helvetica','bold'); doc.setFontSize(fs(9));
    text(`${label} ${d.number} — ${d.client} — ${fmtDate(d.date)} — ${d.status}`, margin); y+= small?3.6:5;
    doc.setFont('helvetica','normal'); doc.setFontSize(fs(small?7:8.5));

      ensure(10);
      doc.autoTable({

          const lt=(l.qty||0)*(l.price||0);

  sectionTitle('INTERVENTIONS');
  if(!z.interventions.length){ ensure(4); doc.setFont('helvetica','italic'); doc.setFontSize(fs(8.5)); text('Aucune intervention sur la période.', margin); y+=small?3.4:5; doc.setFont('helvetica','normal'); }
  z.interventions.forEach(it=>{

    text(`INT ${it.number} — ${it.client} — ${fmtDate(it.date)} ${it.heure||''} — ${it.status}`, margin); y+= small?3.6:5;
    doc.setFont('helvetica','normal'); doc.setFontSize(fs(small?7:8.5));

    if(it.lines && it.lines.length){
      ensure(10);
      doc.autoTable({
        startY: y,
        head: small ? [['Désig.','Qté','PU','Total']] : [['Désignation','Qté','PU HT','TVA','Total HT']],
        body: it.lines.map(l=>{
          const lt=(l.qty||0)*(l.price||0);
          return small ? [l.desc,String(l.qty),fmtMoney(l.price),fmtMoney(lt)] : [l.desc,String(l.qty),fmtMoney(l.price),(l.tva||0)+'%',fmtMoney(lt)];
        }),
        margin:{left:margin, right:margin},
        styles:{ fontSize: fs(small?6.5:8), cellPadding: small?1:2, font:'helvetica' },
        headStyles:{ fillColor:[22,26,35], textColor:255, fontStyle:'bold' },

    y += small?1.5:3;

  sectionTitle('RENDEZ-VOUS');
  if(!z.appointments.length){ ensure(4); doc.setFont('helvetica','italic'); doc.setFontSize(fs(8.5)); text('Aucun rendez-vous sur la période.', margin); y+=small?3.4:5; doc.setFont('helvetica','normal'); }
  else {
    ensure(10);
    doc.autoTable({
      startY: y,
      head: [['Date','Heure','Client','Objet','Statut']],
      body: z.appointments.map(a=>[fmtDate(a.date), a.heure||'', a.client, a.titre||'', appointmentStatusLabel(a.status)]),

      styles:{ fontSize: fs(small?6.5:8), cellPadding: small?1:2, font:'helvetica' },
      headStyles:{ fillColor:[22,26,35], textColor:255, fontStyle:'bold' },
    });
    y = doc.lastAutoTable.finalY + (small?3:5);
  }

  doc.save(`${z.number}_${format}.pdf`);
}

async function testDolibarrConnection(){
  const box = document.getElementById('dolTestResult');
  box.innerHTML = `<div style="font-size:12.5px;color:var(--muted);">Test en cours...</div>`;
  const cfg = db.dolibarr;
  if(!cfg.url){ box.innerHTML = errBox("Renseigne d'abord l'URL de l'API."); return; }
  if(!cfg.apiKey){ box.innerHTML = errBox("Renseigne d'abord la clé API."); return; }
  const base = cfg.url.replace(/\/+$/,'');
  try{
    const res = await fetch(base+'/status', {
      method:'GET',
      headers:{ 'DOLAPIKEY': cfg.apiKey }
    });
    const raw = await res.text();
    let data=null; try{ data = raw?JSON.parse(raw):null; }catch(e){ data = raw; }
    if(res.ok){
      box.innerHTML = okBox('Connexion OK — l\'API Dolibarr répond correctement. Tu peux lancer les synchros depuis la page « Ticket Z ».');
    } else if(res.status===401 || res.status===403){
      box.innerHTML = errBox(`Connexion établie mais accès refusé (HTTP ${res.status}). Vérifie la clé API (DOLAPIKEY) : Dolibarr → ta fiche utilisateur → onglet « Clé API », et vérifie que cet utilisateur a les droits API/lecture nécessaires.`);
    } else if(res.status===404){
      box.innerHTML = errBox(`Endpoint introuvable (HTTP 404). Vérifie l'URL : elle doit pointer sur .../api/index.php (sans slash final), et le module « API REST » doit être activé dans Dolibarr (Configuration → Modules → API REST).`);
    } else {
      box.innerHTML = errBox(`Réponse HTTP ${res.status}. Détail : ${typeof data==='string'?data:(data&&data.error&&data.error.message)||'—'}`);
    }
  }catch(e){
    // "Failed to fetch" est une erreur réseau/CORS du navigateur, pas une erreur HTTP :
    // le navigateur n'a même pas pu atteindre le serveur ou a bloqué la réponse.
    box.innerHTML = errBox(
      `Échec réseau : "${e.message}". Causes les plus fréquentes :<br>` +
      `• <b>CORS</b> : Dolibarr n'envoie pas d'en-tête Access-Control-Allow-Origin, donc le navigateur bloque la requête ` +
      `si cette page CRM n'est pas exactement sur la même origine (même protocole + domaine + port) que l'API. ` +
      `C'est très souvent le cas si tu ouvres ce fichier en double-cliquant dessus (adresse en file://) au lieu de le servir via un vrai serveur web.<br>` +
      `• <b>URL incorrecte ou serveur non joignable</b> : vérifie que Dolibarr tourne bien sur cette adresse en collant ` +
      `<span style="font-family:var(--mono)">${esc(base)}/status</span> dans un nouvel onglet du navigateur (tu devrais voir du JSON, pas une erreur 404).<br>` +
      `• <b>HTTPS → HTTP</b> : si ce CRM est ouvert en https:// et que l'API est en http://localhost, le navigateur bloque aussi (contenu mixte).`
    );
  }
}
function okBox(msg){ return `<div class="card" style="padding:10px 14px;background:#dbe8de;border-color:var(--good);font-size:12.5px;color:#1f4a30;">✔ ${msg}</div>`; }
function errBox(msg){ return `<div class="card" style="padding:10px 14px;background:#f3d6d1;border-color:#a13a2f;font-size:12.5px;color:#7a271c;line-height:1.6;">✕ ${msg}</div>`; }
function bindSettings(){
  const syncBtn = document.getElementById('syncCompanyNowBtn');
  if(syncBtn){
    syncBtn.onclick = async ()=>{
      syncBtn.disabled = true; syncBtn.textContent = 'Synchro en cours...';
      const r = await syncDolibarrCompany();
      if(!r) alert("Échec de la synchro société : "+(db.dolibarr.lastCompanyError||"erreur inconnue")+"\n\nVérifie l'URL, la clé API, et que l'endpoint /mysoc est bien accessible sur ton Dolibarr.");
      render();
    };
  }
  document.getElementById('saveSettingsBtn').onclick = ()=>{
    db.company = { nom: val('s_nom'), siret: val('s_siret'), adresse: val('s_adresse'), tel: val('s_tel'), email: val('s_email'), tva: val('s_tva') };
    save(); render();
  };
  document.getElementById('exportJsonBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'evidence_sauvegarde_'+todayISO()+'.json';
    a.click();
  };
  document.getElementById('importJson').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{ db = JSON.parse(reader.result); save(); render(); alert('Import réussi.'); }
      catch(err){ alert('Fichier invalide.'); }
    };
    reader.readAsText(file);
  };
  document.getElementById('saveDolBtn').onclick = ()=>{
    db.dolibarr.url = val('dol_url').trim();
    db.dolibarr.apiKey = val('dol_key').trim();
    db.dolibarr.autoCreateThirdParty = document.getElementById('dol_autocreate').checked;
    db.dolibarr.warehouseId = val('dol_warehouse').trim();
    db.dolibarr.rdvOwnerId = val('dol_rdv_owner').trim();
    db.dolibarr.paymentModeId = val('dol_payment_mode').trim();
    db.dolibarr.bankAccountId = val('dol_bank_account').trim();
    db.dolibarr.excludeKeywords = val('dol_exclude_keywords').trim();
    save();
    alert('Configuration Dolibarr enregistrée.');
  };
  document.getElementById('testDolBtn').onclick = ()=>{
    // on enregistre d'abord les champs saisis pour tester la config actuelle même si "Enregistrer" n'a pas été cliqué
    db.dolibarr.url = val('dol_url').trim();
    db.dolibarr.apiKey = val('dol_key').trim();
    save();
    testDolibarrConnection();
  };

  // ---- Zone de danger : suppression en masse par type, uniquement locale (aucun appel Dolibarr) ----
  function bulkDelete(btnId, label, count, run){
    const btn = document.getElementById(btnId);
    if(!btn) return;
    btn.onclick = ()=>{
      if(!count){ alert(`Aucun${label.match(/^[aeiouAEIOU]/)?'e':''} ${label} à supprimer.`); return; }
      if(!confirm(`Supprimer définitivement les ${count} ${label} d'Evidence ?\n\nCette action est irréversible. Rien ne sera supprimé côté Dolibarr : seule la trace locale dans Evidence disparaît.`)) return;
      run();
      save(); render();
    };
  }
  bulkDelete('bulkDelFactures', 'facture(s)', db.documents.filter(d=>d.type==='facture').length,
    ()=>{ db.documents = db.documents.filter(d=>d.type!=='facture'); });
  bulkDelete('bulkDelDevis', 'devis', db.documents.filter(d=>d.type==='devis').length,
    ()=>{ db.documents = db.documents.filter(d=>d.type!=='devis'); });
  bulkDelete('bulkDelBl', 'bon(s) de livraison', db.documents.filter(d=>d.type==='bl').length,
    ()=>{ db.documents = db.documents.filter(d=>d.type!=='bl'); });
  bulkDelete('bulkDelInterventions', 'intervention(s)', db.interventions.length,
    ()=>{ db.interventions = []; });
  bulkDelete('bulkDelContrats', 'contrat(s)', db.contracts.length,
    ()=>{ db.contracts = []; });
}

  document.querySelectorAll('.del-contact').forEach(el=>el.onclick=()=>{ if(confirm('Supprimer ce contact ?')){ db.contacts=db.contacts.filter(c=>c.id!==el.dataset.id); save(); render(); } });
  document.querySelectorAll('.edit-product').forEach(el=>el.onclick=()=>openProductModal(el.dataset.id));
  document.querySelectorAll('.del-product').forEach(el=>el.onclick=()=>{ if(confirm('Supprimer ce produit ?')){ db.products=db.products.filter(p=>p.id!==el.dataset.id); save(); render(); } });
  document.querySelectorAll('.open-doc, .doc-row').forEach(el=>el.onclick=()=>{ const doc = db.documents.find(d=>d.id===el.dataset.id); if(doc) openDocEditor(doc.id, doc.type); });
  document.querySelectorAll('.del-doc').forEach(el=>el.onclick=()=>{ if(confirm("Supprimer ce document de l'historique Evidence ?\n\nIl ne sera retiré que d'Evidence — si ce document a déjà été envoyé vers Dolibarr, il y restera intact.")){ db.documents=db.documents.filter(d=>d.id!==el.dataset.id); save(); render(); } });
  document.querySelectorAll('.open-contract').forEach(el=>el.onclick=()=>openContractModal(el.dataset.id));
  document.querySelectorAll('.del-contract').forEach(el=>el.onclick=()=>{ if(confirm('Supprimer ce contrat ?')){ db.contracts=db.contracts.filter(c=>c.id!==el.dataset.id); save(); render(); } });
  document.querySelectorAll('.open-intervention').forEach(el=>el.onclick=()=>openInterventionModal(el.dataset.id));
  document.querySelectorAll('.del-intervention').forEach(el=>el.onclick=()=>{ if(confirm('Supprimer cette intervention ?')){ db.interventions=db.interventions.filter(i=>i.id!==el.dataset.id); save(); render(); } });
}

/* ============================================================
   RECHERCHE GLOBALE (tiers, factures/devis/BL, interventions)
   ============================================================ */
function globalSearch(qRaw){
  const q = (qRaw||'').trim().toLowerCase();
  if(q.length < 1) return { contacts:[], documents:[], interventions:[], appointments:[] };
  const norm = s => (s||'').toString().toLowerCase();

  const contacts = db.contacts.filter(c=>
    norm(c.nom).includes(q) || norm(c.email).includes(q) || norm(c.tel).includes(q) ||
    norm(c.ville).includes(q) || norm(c.adresse).includes(q)
  ).slice(0,8);

  const documents = db.documents.filter(d=>{
    const c = db.contacts.find(c=>c.id===d.contactId);
    return norm(d.number).includes(q) || norm(c && c.nom).includes(q) || norm(d.clientLabel).includes(q) || norm(d.notes).includes(q) ||
      norm(d.numeroSuivi).includes(q) || norm(d.transporteur).includes(q);
  }).slice(0,8);

  const interventions = db.interventions.filter(it=>{
    const c = db.contacts.find(c=>c.id===it.contactId);
    return norm(it.number).includes(q) || norm(c && c.nom).includes(q) ||
      norm(it.description).includes(q) || norm(it.technicien).includes(q);
  }).slice(0,8);

  const appointments = db.appointments.filter(a=>{
    const c = db.contacts.find(c=>c.id===a.contactId);
    return norm(c && c.nom).includes(q) || norm(a.clientLabel).includes(q) ||
      norm(a.objet || a.titre).includes(q) || norm(a.lieu).includes(q) || norm(a.notes).includes(q);
  }).slice(0,8);

  return { contacts, documents, interventions, appointments };
}

function renderGlobalSearchResults(q){
  const box = document.getElementById('globalSearchResults');
  const { contacts, documents, interventions, appointments } = globalSearch(q);
  const total = contacts.length + documents.length + interventions.length + appointments.length;
  if(!q.trim()){ box.classList.remove('show'); box.innerHTML=''; return; }
  if(!total){ box.innerHTML = `<div class="search-empty">Aucun résultat pour « ${esc(q)} ».</div>`; box.classList.add('show'); return; }

  let html = '';
  if(contacts.length){
    html += `<div class="search-group-title">Tiers</div>`;
    html += contacts.map(c=>`
      <div class="search-item" data-kind="contact" data-id="${c.id}">
        <span class="si-title">${esc(c.nom)}</span>
        <span class="si-sub">${c.type==='client'?'Client':'Fournisseur'}${c.tel?' · '+esc(c.tel):''}${c.email?' · '+esc(c.email):''}</span>
      </div>`).join('');
  }
  if(documents.length){
    html += `<div class="search-group-title">Devis / factures / BL</div>`;
    html += documents.map(d=>{
      const c = db.contacts.find(c=>c.id===d.contactId);
      return `<div class="search-item" data-kind="document" data-id="${d.id}" data-doctype="${d.type}">
        <span class="si-title">${esc(d.number)} — ${docMeta(d.type).singular}</span>
        <span class="si-sub">${c?esc(c.nom):(d.clientLabel?esc(d.clientLabel):'—')} · ${fmtDate(d.date)} · ${statusPill(d.status, d.type)}</span>
      </div>`;
    }).join('');
  }
  if(interventions.length){
    html += `<div class="search-group-title">Interventions</div>`;
    html += interventions.map(it=>{
      const c = db.contacts.find(c=>c.id===it.contactId);
      return `<div class="search-item" data-kind="intervention" data-id="${it.id}">
        <span class="si-title">${esc(it.number)}</span>
        <span class="si-sub">${c?esc(c.nom):'—'} · ${fmtDate(it.date)}</span>
      </div>`;
    }).join('');
  }
  if(appointments.length){
    html += `<div class="search-group-title">Rendez-vous</div>`;
    html += appointments.map(a=>{
      const c = db.contacts.find(c=>c.id===a.contactId);
      return `<div class="search-item" data-kind="appointment" data-id="${a.id}">
        <span class="si-title">${esc(a.objet || a.titre || 'Rendez-vous')}</span>
        <span class="si-sub">${c?esc(c.nom):(a.clientLabel?esc(a.clientLabel):'—')} · ${fmtDate(a.date)}${a.heure?' '+esc(a.heure):''} · ${appointmentStatusLabel(a.status)}</span>
      </div>`;
    }).join('');
  }
  box.innerHTML = html;
  box.classList.add('show');

  box.querySelectorAll('.search-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const kind = el.dataset.kind, id = el.dataset.id;
      box.classList.remove('show');
      document.getElementById('globalSearch').value = '';
      if(kind==='contact'){
        currentRoute = 'contacts'; render(); openContactModal(id);
      } else if(kind==='document'){
        currentRoute = el.dataset.doctype; render(); openDocEditor(id, el.dataset.doctype);
      } else if(kind==='intervention'){
        currentRoute = 'interventions'; render(); openInterventionModal(id);
      } else if(kind==='appointment'){
        currentRoute = 'rdv'; render(); openAppointmentModal(id);
      }
    });
  });
}

function bindGlobalSearch(){
  const input = document.getElementById('globalSearch');
  const box = document.getElementById('globalSearchResults');
  input.addEventListener('input', ()=> renderGlobalSearchResults(input.value));
  input.addEventListener('focus', ()=>{ if(input.value.trim()) renderGlobalSearchResults(input.value); });
  document.addEventListener('click', (e)=>{
    if(!document.getElementById('globalSearchWrap').contains(e.target)){ box.classList.remove('show'); }
  });
  input.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ box.classList.remove('show'); input.blur(); } });
}

/* ============================================================
   SYNCHRONISATION AUTOMATIQUE DES INFOS SOCIÉTÉ (Dolibarr → Ma Société)
   Récupère la fiche "Ma société" configurée dans Dolibarr (Accueil >
   Configuration > Société) via l'endpoint /mysoc, et met à jour db.company
   sans action manuelle : au chargement de l'app (si config présente et pas
   déjà synchro aujourd'hui) et à chaque "Synchro matin".
   ============================================================ */
async function syncDolibarrCompany(){
  if(!db.dolibarr.url || !db.dolibarr.apiKey){
    db.dolibarr.lastCompanyError = "Synchro impossible : URL ou clé API Dolibarr non configurée (Paramètres).";
    return null;
  }
  try{
    const soc = await dolFetch('/setup/company');
    if(!soc || typeof soc!=='object'){
      db.dolibarr.lastCompanyError = "Réponse inattendue de Dolibarr (fiche société vide ou introuvable sur /mysoc).";
      save();
      return null;
    }
    const adresseLignes = [soc.address, [soc.zip, soc.town].filter(Boolean).join(' ')].filter(Boolean).join('\n');
    db.company = {
      nom: soc.name || db.company.nom,
      adresse: adresseLignes || db.company.adresse,
      siret: soc.idprof1 || soc.siren || db.company.siret,
      tva: soc.tva_intra || db.company.tva,
      tel: soc.phone || db.company.tel,
      email: soc.email || db.company.email
    };
    db.dolibarr.lastCompanySync = new Date().toISOString();
    db.dolibarr.lastCompanyError = null;
    save();
    dolLog('ok', `Infos société synchronisées automatiquement depuis Dolibarr ("${db.company.nom}").`);
    return db.company;
  }catch(e){
    db.dolibarr.lastCompanyError = e.message || "Erreur inconnue lors de la synchro des infos société.";
    save();
    dolLog('err', 'Échec synchro auto des infos société : '+e.message);
    return null;
  }
}
function autoSyncCompanyIfNeeded(){
  if(!db.dolibarr.url || !db.dolibarr.apiKey) return;
  const last = db.dolibarr.lastCompanySync;
  const today = todayISO();
  if(last && last.slice(0,10)===today) return; // déjà synchro aujourd'hui
  syncDolibarrCompany().then(()=>{ if(currentRoute==='settings' || currentRoute==='dashboard') render(); });
}

/* init */
bindGlobalSearch();
autoSyncCompanyIfNeeded();
render();
