<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidence — CRM local</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#161a23;
  --paper:#f4f2ec;
  --panel:#ffffff;
  --line:#e4e0d4;
  --slate:#2f3542;
  --accent:#b5502f;
  --accent-soft:#f0d9cd;
  --good:#3c6e52;
  --muted:#7a7669;
  --mono:'JetBrains Mono', 'Courier New', monospace;
  --sans:'Inter', -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  display:flex;
  min-height:100vh;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d5d0c0;border-radius:4px;}

/* ---- Sidebar ---- */
#sidebar{
  width:220px;
  min-width:220px;
  background:var(--slate);
  color:#e9e6dc;
  display:flex;
  flex-direction:column;
  padding:22px 0;
}
.brand{
  font-family:var(--mono);
  font-weight:700;
  font-size:20px;
  letter-spacing:0.5px;
  padding:0 20px 22px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  margin-bottom:10px;
}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:#9aa0ad;margin-top:2px;letter-spacing:0.3px;}
nav{flex:1;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 20px;
  font-size:14px;
  cursor:pointer;
  color:#c7cad3;
  border-left:3px solid transparent;
  transition:background .12s;
}
.nav-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
.nav-item.active{background:rgba(255,255,255,0.08);color:#fff;border-left-color:var(--accent);font-weight:600;}
.nav-tag{font-family:var(--mono);font-size:11px;opacity:.55;margin-left:auto;}
.sidebar-foot{padding:14px 20px 0;font-size:11px;color:#7d8291;border-top:1px solid rgba(255,255,255,0.08);margin-top:10px;padding-top:14px;}
.sidebar-foot .powered-by{margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.3px;color:#565c6b;}

/* ---- Main ---- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
header.topbar{
  padding:18px 32px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
header.topbar h1{font-size:19px;margin:0;font-weight:700;}
header.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--mono);}
#content{padding:28px 32px;flex:1;overflow-y:auto;}

/* ---- Global search ---- */
.search-wrap{position:relative;flex:1;max-width:420px;margin:0 24px;}
.search-wrap input{width:100%;padding:9px 12px;font-size:13.5px;border:1px solid var(--line);border-radius:5px;background:var(--paper);}
.search-wrap input:focus{outline:none;border-color:var(--accent);background:#fff;}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:420px;overflow-y:auto;display:none;z-index:40;}
.search-results.show{display:block;}
.search-group-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:9px 14px 4px;}
.search-item{display:flex;flex-direction:column;gap:2px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--line);}
.search-item:first-child{border-top:none;}
.search-item:hover{background:#faf9f5;}
.search-item .si-title{font-size:13.5px;font-weight:600;color:var(--ink);}
.search-item .si-sub{font-size:11.5px;color:var(--muted);font-family:var(--mono);}
.search-empty{padding:14px;font-size:12.5px;color:var(--muted);text-align:center;}

/* ---- generic components ---- */
.btn{
  font-family:var(--sans);
  border:1px solid var(--ink);
  background:var(--ink);
  color:#fff;
  padding:9px 16px;
  font-size:13px;
  font-weight:600;
  border-radius:3px;
  cursor:pointer;
}
.btn:hover{opacity:.88;}
.btn.secondary{background:transparent;color:var(--ink);}
.btn.accent{background:var(--accent);border-color:var(--accent);}
.btn.danger{background:transparent;color:#a13a2f;border-color:#a13a2f;}
.btn.small{padding:5px 10px;font-size:12px;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat{padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:6px;}
.stat .num{font-family:var(--mono);font-size:24px;font-weight:700;}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;}

table.grid{width:100%;border-collapse:collapse;background:var(--panel);}
table.grid th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);border-bottom:1px solid var(--line);padding:10px 12px;font-weight:600;
}
table.grid td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;}
table.grid tr:hover td{background:#faf9f5;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono);}
.pill.brouillon{background:#e9e6dc;color:#57574f;}
.pill.valide{background:#dbe8de;color:var(--good);}
.pill.envoye{background:#dde3ee;color:#3a5488;}
.pill.paye{background:#d8ecdb;color:#256b3d;}
.pill.sync-ok{background:#d8ecdb;color:#256b3d;}
.pill.sync-pending{background:#f0d9cd;color:var(--accent);}
.pill.sync-err{background:#f3d6d1;color:#a13a2f;}
.pill.refuse{background:#f3d6d1;color:#a13a2f;}
.pill.absent{background:#e6d9f0;color:#6b3fa0;}
.pill.reporte{background:#f5e6c8;color:#8a6414;}
.pill.retard{background:#f3d6d1;color:#a13a2f;}

/* ---- Ticket Z ---- */
.z-toolbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px;}
.z-toolbar .field{margin:0;}
.z-doc-section{margin-bottom:18px;}
.z-doc-section h3{font-size:13px;text-transform:uppercase;letter-spacing:.4px;margin:0 0 8px;color:var(--slate);border-bottom:2px solid var(--ink);padding-bottom:4px;}
.z-doc-block{border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin-bottom:8px;background:#fff;}
.z-doc-block .z-doc-head{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:4px;}
.z-doc-block table.grid{margin-top:6px;}
.z-empty-line{color:var(--muted);font-size:12.5px;font-style:italic;}
.z-history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:5px;background:#fff;margin-bottom:8px;}
.sync-log{font-family:var(--mono);font-size:11.5px;background:#161a23;color:#c9d0dc;border-radius:5px;padding:10px 12px;max-height:220px;overflow-y:auto;line-height:1.6;}
.sync-log .l-err{color:#e79483;}
.sync-log .l-ok{color:#8fd6a8;}
.sync-log .l-info{color:#9aa0ad;}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.toolbar .filters{display:flex;gap:8px;}
input, select, textarea{
  font-family:var(--sans);
  border:1px solid var(--line);
  border-radius:4px;
  padding:8px 10px;
  font-size:13.5px;
  background:#fff;
  color:var(--ink);
}
textarea{resize:vertical;}
label{font-size:12px;font-weight:600;color:var(--slate);display:block;margin-bottom:4px;}
.field{margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

/* modal */
.overlay{position:fixed;inset:0;background:var(--paper);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;}
.overlay.show{display:flex;}
.modal{background:var(--panel);border-radius:8px;width:100%;max-width:640px;padding:26px 28px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal h2{margin-top:0;font-size:17px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

.empty{padding:50px 20px;text-align:center;color:var(--muted);}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px;}

/* doc editor */
.doc-head{display:flex;justify-content:space-between;gap:20px;margin-bottom:20px;}
.lines-table th,.lines-table td{padding:8px;}
.lines-table input{width:100%;padding:6px 8px;font-size:13px;}
.qty-col,.price-col,.tva-col,.total-col{width:90px;}
.totals-box{margin-left:auto;width:280px;margin-top:14px;}
.totals-box .row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
.totals-box .row.grand{font-weight:700;font-size:16px;border-bottom:none;padding-top:10px;}

.export-row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;}
.format-choice{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;}
.format-choice button{border:none;background:#fff;padding:8px 14px;font-size:12.5px;font-family:var(--mono);cursor:pointer;}
.format-choice button.active{background:var(--ink);color:#fff;}

/* contrat: tabs */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tabbtn{background:none;border:none;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--sans);}
.tabbtn.active{color:var(--ink);border-bottom-color:var(--accent);}
.tabpane{display:none;}
.tabpane.active{display:block;}

/* signature pad */
.sig-wrap{border:1px dashed var(--line);border-radius:6px;padding:10px;background:#fafaf7;}
.sig-wrap canvas{width:100%;height:140px;background:#fff;border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair;}
.sig-label{font-size:12px;font-weight:600;color:var(--slate);margin-bottom:6px;}
.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

/* photo capture */
.photo-slot{border:1px dashed var(--line);border-radius:6px;padding:10px;text-align:center;background:#fafaf7;}
.photo-slot img{max-width:100%;max-height:120px;border-radius:4px;display:block;margin:0 auto 8px;}
.photo-slot .ph-empty{height:90px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;margin-bottom:8px;}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
.gallery{display:flex;flex-wrap:wrap;gap:10px;}
.gallery-item{position:relative;width:90px;}
.gallery-item img{width:90px;height:90px;object-fit:cover;border-radius:4px;border:1px solid var(--line);}
.gallery-item .rm{position:absolute;top:-6px;right:-6px;background:#a13a2f;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1;}
.file-btn{display:inline-block;font-size:12px;font-weight:600;padding:6px 12px;border:1px solid var(--ink);border-radius:4px;cursor:pointer;background:#fff;}

/* ---- table wrapper (scroll horizontal sur petits écrans) ---- */
.table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-scroll table.grid{min-width:640px;}

/* ---- menu burger (masqué par défaut, affiché en dessous de 1024px) ---- */
#menuToggle{
  display:none;
  align-items:center;justify-content:center;
  width:38px;height:38px;min-width:38px;
  border:1px solid var(--line);
  background:#fff;border-radius:5px;
  cursor:pointer;font-size:18px;line-height:1;
  margin-right:10px;
}
#sidebarBackdrop{
  display:none;
  position:fixed;inset:0;
  background:rgba(22,26,35,.45);
  z-index:59;
}
#sidebarBackdrop.show{display:block;}

/* ============================================================
   RESPONSIVE : TABLETTE (<=1024px) ET MOBILE ANDROID (<=640px)
   ============================================================ */
@media (max-width:1024px){
  body{display:block;}
  #menuToggle{display:flex;}

  #sidebar{
    position:fixed;
    top:0;left:0;bottom:0;
    width:78vw;
    max-width:300px;
    min-width:0;
    transform:translateX(-100%);
    transition:transform .22s ease;
    z-index:60;
    overflow-y:auto;
    box-shadow:0 0 40px rgba(0,0,0,.3);
  }
  #sidebar.open{transform:translateX(0);}
  .nav-item{padding:14px 20px;font-size:15px;}

  #main{min-width:0;width:100%;}
  header.topbar{
    padding:14px 16px;
    flex-wrap:wrap;
    row-gap:10px;
  }
  header.topbar h1{font-size:17px;}
  .search-wrap{
    order:3;
    margin:0;
    max-width:none;
    flex:1 1 100%;
  }
  #topActions{order:2;}
  #topActions .btn{padding:10px 14px;font-size:13px;}

  #content{padding:16px;}

  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .grid2,.grid3{grid-template-columns:1fr;gap:0;}
  .grid2 .field,.grid3 .field{margin-bottom:14px;}
  .photo-grid{grid-template-columns:1fr;}
  .sig-row{grid-template-columns:1fr;gap:10px;}

  .doc-head{flex-wrap:wrap;}
  .totals-box{width:100%;margin-left:0;}

  .toolbar{flex-direction:column;align-items:stretch;}
  .toolbar .filters{flex-wrap:wrap;}
  .z-toolbar{flex-direction:column;align-items:stretch;}

  .modal{
    max-width:100%;
    width:100%;
    max-height:100%;
    height:100%;
    border-radius:0;
    padding:20px 16px 90px;
  }
  .overlay{padding:0;align-items:stretch;}
  .modal-actions{
    position:sticky;bottom:-90px;
    background:var(--panel);
    margin:16px -16px -90px;
    padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
    border-top:1px solid var(--line);
  }

  /* cibles tactiles plus grandes */
  .btn{padding:11px 16px;font-size:14px;min-height:42px;}
  .btn.small{padding:9px 12px;font-size:13px;min-height:36px;}
  input,select,textarea{font-size:16px;padding:10px 11px;}
  .lines-table input{font-size:14px;}
}

@media (max-width:640px){
  .brand{font-size:18px;}
  header.topbar{padding:12px 12px;}
  header.topbar h1{font-size:16px;}
  header.topbar .sub{font-size:11px;}
  #content{padding:12px;}

  .stat-grid{grid-template-columns:1fr;}
  .stat .num{font-size:20px;}

  table.grid th,table.grid td{padding:8px 9px;font-size:12.5px;}

  .z-doc-block{padding:8px 10px;}
  .qty-col,.price-col,.tva-col,.total-col{width:70px;}

  .toolbar .filters{flex-direction:column;align-items:stretch;}
  .toolbar .filters select,.toolbar .filters input{width:100%;}

  .search-item .si-title{font-size:13px;}
  .gallery-item{width:78px;}
  .gallery-item img{width:78px;height:78px;}

  .format-choice{width:100%;}
  .format-choice button{flex:1;padding:10px 8px;}
  .export-row{flex-direction:column;align-items:stretch;}
}
</style>
</head>
<body>

<div id="sidebarBackdrop"></div>
<div id="sidebar">
  <div class="brand">EVIDENCE</div>
  <nav id="nav"></nav>
  <div class="sidebar-foot">Données stockées uniquement<br>sur cet appareil (localStorage).<div class="powered-by">Powered by Velbold</div></div>
</div>

<div id="main">
  <header class="topbar">
    <button id="menuToggle" type="button" aria-label="Ouvrir le menu">☰</button>
    <div>
      <h1 id="pageTitle">Tableau de bord</h1>
      <div class="sub" id="pageSub">—</div>
    </div>
    <div class="search-wrap" id="globalSearchWrap">
      <input type="text" id="globalSearch" placeholder="Rechercher un tiers, une facture, une intervention, un rendez-vous..." autocomplete="off">
      <div class="search-results" id="globalSearchResults"></div>
    </div>
    <div id="topActions"></div>
  </header>
  <div id="content"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

<script>
/* ============================================================
   ETAT / STOCKAGE
   ============================================================ */
const DB_KEY = 'gesto_crm_v1';
let db = load();

function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    company:{ nom:'Ma Société', adresse:"1 rue de l'Exemple\n69000 Lyon", siret:'', tva:'', tel:'', email:'' },
    contacts:[],
    products:[],
    documents:[],
    contracts:[],
    appointments:[],
    interventions:[],
    ticketsZ:[],
    counters:{ devis:0, facture:0, bl:0, contrat:0, intervention:0, ticketz:0 },
    dolibarr:{ url:'', apiKey:'', autoCreateThirdParty:true, lastMorningSync:null, lastEveningSync:null, lastCompanySync:null, lastCompanyError:null, paymentModeId:'', bankAccountId:'', log:[] }
  };
}
// migration pour bases existantes créées avant les modules Contrats / RDV / Interventions / Ticket Z / Dolibarr
db = load();
db.contracts = db.contracts || [];
db.appointments = db.appointments || [];
db.interventions = db.interventions || [];
db.ticketsZ = db.ticketsZ || [];
db.counters = db.counters || {};
db.counters.contrat = db.counters.contrat || 0;
db.counters.intervention = db.counters.intervention || 0;
db.counters.ticketz = db.counters.ticketz || 0;
db.dolibarr = db.dolibarr || { url:'', apiKey:'', autoCreateThirdParty:true, lastMorningSync:null, lastEveningSync:null, log:[] };
db.dolibarr.log = db.dolibarr.log || [];
if(!('lastCompanyError' in db.dolibarr)) db.dolibarr.lastCompanyError = null;
if(!('lastProductsSync' in db.dolibarr)) db.dolibarr.lastProductsSync = null;
if(!('lastInvoicesPull' in db.dolibarr)) db.dolibarr.lastInvoicesPull = null;
if(!('lastProposalsPull' in db.dolibarr)) db.dolibarr.lastProposalsPull = null;
if(!('lastAppointmentsPull' in db.dolibarr)) db.dolibarr.lastAppointmentsPull = null;
if(!('paymentModeId' in db.dolibarr)) db.dolibarr.paymentModeId = '';
if(!('bankAccountId' in db.dolibarr)) db.dolibarr.bankAccountId = '';

function save(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }catch(e){
    alert("Stockage plein : impossible d'enregistrer. Supprime des photos de contrats ou exporte/allège tes données (Paramètres > Exporter), puis réessaie.");
  }
}
function uid(){ return 'x'+Math.random().toString(36).slice(2,10); }
/* ---- Scanner caméra générique (réutilisé pour la saisie du n° de suivi ET la recherche de colis) ---- */
async function scanBarcodeWithCamera(onResult){
  if(!('BarcodeDetector' in window)){
    alert("Le scan par caméra n'est pas pris en charge par ce navigateur. Utilise une douchette USB/Bluetooth (elle se comporte comme un clavier) ou saisis le code manuellement.");
    return;
  }
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
  }catch(err){ alert("Impossible d'accéder à la caméra."); return; }
  const video = document.createElement('video');
  video.srcObject = stream; video.setAttribute('playsinline','');
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ Fermer'; closeBtn.className='btn secondary';
  closeBtn.style.cssText='position:absolute;top:16px;right:16px;';
  video.style.cssText = 'max-width:92vw;max-height:80vh;';
  overlay.appendChild(video); overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);
  await video.play();
  let stopped = false;
  const stopAll = ()=>{ stopped = true; stream.getTracks().forEach(t=>t.stop()); overlay.remove(); };
  closeBtn.onclick = stopAll;
  try{
    const detector = new BarcodeDetector();
    const loop = async ()=>{
      if(stopped) return;
      try{
        const codes = await detector.detect(video);
        if(codes && codes.length){
          playBeep(1600, 0.1);
          stopAll();
          onResult(codes[0].rawValue);
          return;
        }
      }catch(err){ /* frame illisible, on continue */ }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(err){ alert("Erreur du scanner caméra."); stopAll(); }
}
function playBeep(freq, dur){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq || 1500;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (dur||0.12));
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + (dur||0.12));
    osc.onended = ()=> ctx.close().catch(()=>{});
  }catch(e){ /* audio non disponible, on ignore silencieusement */ }
}
function fmtMoney(n){ return (Math.round((n||0)*100)/100).toFixed(2).replace('.',',') + ' €'; }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('fr-FR'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

   ============================================================ */
const ROUTES = [
  {id:'dashboard', label:'Tableau de bord', icon:'◆'},
  {id:'contacts', label:'Contacts', icon:'●'},
  {id:'products', label:'Produits', icon:'▪'},
  {id:'devis', label:'Devis', icon:'▤', doctype:'devis'},
  {id:'facture', label:'Factures', icon:'▤', doctype:'facture'},
  {id:'bl', label:'Livraisons', icon:'▤', doctype:'bl'},
  {id:'rdv', label:'Rendez-vous', icon:'◷'},

  {id:'ticketz', label:'Ticket Z', icon:'▦'},
  {id:'settings', label:'Paramètres', icon:'⚙'},
];
let currentRoute = 'dashboard';

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = ROUTES.map(r=>`
    <div class="nav-item ${currentRoute===r.id?'active':''}" data-route="${r.id}">
      <span>${r.icon}</span><span>${r.label}</span>
    </div>`).join('');

    el.addEventListener('click', ()=>{ currentRoute = el.dataset.route; render(); closeSidebar(); });

/* ---- menu mobile/tablette (tiroir) ---- */
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
}
document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);

/* ---- rend les tableaux scrollables horizontalement (tablette/mobile) ---- */
function wrapTables(root){
  if(!root) return;
  root.querySelectorAll('table.grid').forEach(t=>{
    if(t.parentElement && t.parentElement.classList.contains('table-scroll')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
}

function render(){
  renderNav();
  const titleEl = document.getElementById('pageTitle');
  const subEl = document.getElementById('pageSub');
  const actions = document.getElementById('topActions');
  actions.innerHTML = '';
  const content = document.getElementById('content');

  if(currentRoute==='dashboard'){
    titleEl.textContent = 'Tableau de bord';
    subEl.textContent = db.company.nom;
    content.innerHTML = renderDashboard();
  } else if(currentRoute==='contacts'){
    titleEl.textContent = 'Contacts';
    subEl.textContent = db.contacts.length + ' contact(s)';
    actions.innerHTML = `<button class="btn accent" id="addContactBtn">+ Nouveau contact</button>`;
    content.innerHTML = renderContacts();
    document.getElementById('addContactBtn').onclick = ()=>openContactModal();
  } else if(currentRoute==='products'){
    titleEl.textContent = 'Produits & services';
    subEl.textContent = db.products.length + ' référence(s)';
    actions.innerHTML = `<button class="btn accent" id="addProductBtn">+ Nouveau produit</button>`;
    content.innerHTML = renderProducts();
    document.getElementById('addProductBtn').onclick = ()=>openProductModal();
  } else if(['devis','facture','bl'].includes(currentRoute)){
    const meta = docMeta(currentRoute);
    titleEl.textContent = meta.plural;
    subEl.textContent = db.documents.filter(d=>d.type===currentRoute).length + ' document(s)';
    actions.innerHTML = `<button class="btn accent" id="addDocBtn">+ Nouveau ${meta.singular.toLowerCase()}</button>`;
    content.innerHTML = renderDocList(currentRoute);
    document.getElementById('addDocBtn').onclick = ()=>openDocEditor(null, currentRoute);
    bindDocListFilters();
  } else if(currentRoute==='rdv'){
    titleEl.textContent = 'Rendez-vous';
    subEl.textContent = db.appointments.length + ' rendez-vous';
    actions.innerHTML = `<button class="btn accent" id="addRdvBtn">+ Nouveau rendez-vous</button>`;
    content.innerHTML = renderAppointments();
    document.getElementById('addRdvBtn').onclick = ()=>openAppointmentModal();
    bindAppointmentView();
  } else if(currentRoute==='interventions'){
    titleEl.textContent = 'Interventions';
    subEl.textContent = db.interventions.length + ' intervention(s)';
    actions.innerHTML = `<button class="btn accent" id="addInterventionBtn">+ Nouvelle intervention</button>`;
    content.innerHTML = renderInterventionList();
    document.getElementById('addInterventionBtn').onclick = ()=>openInterventionModal();
  } else if(currentRoute==='contrats'){
    titleEl.textContent = 'Contrats de vente';
    subEl.textContent = db.contracts.length + ' contrat(s)';
    actions.innerHTML = `<button class="btn accent" id="addContractBtn">+ Nouveau contrat</button>`;
    content.innerHTML = renderContractList();
    document.getElementById('addContractBtn').onclick = ()=>openContractModal();
  } else if(currentRoute==='ticketz'){
    titleEl.textContent = 'Ticket Z';
    subEl.textContent = db.ticketsZ.length + ' ticket(s) Z généré(s)';
    content.innerHTML = renderTicketZ();
    bindTicketZ();
  } else if(currentRoute==='settings'){
    titleEl.textContent = 'Paramètres';
    subEl.textContent = 'Informations société (utilisées sur les documents)';
    content.innerHTML = renderSettings();
    bindSettings();
  }
  wrapTables(content);
  attachListDelegates();
}

function renderDashboard(){

  const ca = facturesValidees.reduce((s,d)=>s+docTotals(d).ttc,0);

  const devisEnCours = db.documents.filter(d=>d.type==='devis' && d.status!=='paye');

  const recentDocs = [...db.documents].sort((a,b)=> (b.date||'').localeCompare(a.date||'')).slice(0,8);
  const todayIso = todayISO();
  const upcomingRdv = [...db.appointments].filter(a=>a.date>=todayIso && a.status!=='annule').sort((a,b)=>(a.date+(a.heure||'')).localeCompare(b.date+(b.heure||''))).slice(0,5);

  return `
    <div class="stat-grid">

    </div>
    <div class="card" style="padding:18px 20px;margin-bottom:20px;">
      <div style="font-weight:700;margin-bottom:12px;">Prochains rendez-vous</div>
      ${upcomingRdv.length ? `
      <table class="grid">
        <tr><th>Date</th><th>Heure</th><th>Contact</th><th>Objet</th><th>Statut</th></tr>
        ${upcomingRdv.map(r=>{
          const c = db.contacts.find(c=>c.id===r.contactId);
          return `<tr><td>${fmtDate(r.date)}</td><td style="font-family:var(--mono)">${r.heure||'—'}</td><td>${c?esc(c.nom):'—'}</td><td>${esc(r.objet||'')}</td><td>${appointmentStatusLabel(r.status)}</td></tr>`;
        }).join('')}
      </table>` : `<div class="empty" style="padding:20px;">Aucun rendez-vous à venir.</div>`}
    </div>
    <div class="card" style="padding:18px 20px;">
      <div style="font-weight:700;margin-bottom:12px;">Derniers documents</div>
      ${recentDocs.length ? `
      <table class="grid">
        <tr><th>Numéro</th><th>Type</th><th>Tiers</th><th>Date</th><th>Statut</th><th>Total TTC</th></tr>
        ${recentDocs.map(d=>{
          const c = db.contacts.find(c=>c.id===d.contactId);
          return `<tr class="doc-row" data-id="${d.id}" style="cursor:pointer">
            <td style="font-family:var(--mono)">${d.number}</td>

/* ============================================================
   DOCUMENTS (Devis / Factures / BL)
   ============================================================ */
function docMeta(type){
  return {
    devis:{singular:'Devis', plural:'Devis', prefix:'DEV'},
    facture:{singular:'Facture', plural:'Factures', prefix:'FAC'},
    bl:{singular:'Bon de livraison', plural:'Bons de livraison', prefix:'BL'}
  }[type];
}
function statusPill(s, type){
  const labels = type==='bl'
    ? {brouillon:'Brouillon', valide:'Validé', envoye:'En livraison', paye:'Livrée', refuse:'Refusée', absent:'Absent', reporte:'Reportée'}
    : {brouillon:'Brouillon', valide:'Validé', envoye:'Envoyé', paye:'Payé'};
  return `<span class="pill ${s}">${labels[s]||s}</span>`;
}
/* une livraison est "en retard" si elle est encore en cours (envoye), qu'une date prévue
   existe, qu'elle est dépassée, et qu'elle n'a ni date réelle ni statut final */
function blIsLate(d){
  return d.type==='bl' && d.status==='envoye' && !!d.dateLivraisonPrevue && d.dateLivraisonPrevue < todayISO();
}
let blFilterStatus = 'all';
let blSearchQuery = '';
let blSearchFocused = false;
let blShowAllHistory = false; // par défaut : liste Livraison = uniquement les livraisons du jour, l'historique se retrouve via la recherche 🔍
function docTotals(d){
  let ht=0, tva=0;
  (d.lines||[]).forEach(l=>{
    const lineHt = (l.qty||0)*(l.price||0);
    ht += lineHt;
    tva += lineHt * ((l.tva||0)/100);
  });
  return { ht, tva, ttc: ht+tva };
}
function nextNumber(type){
  db.counters[type] = (db.counters[type]||0)+1;
  const y = new Date().getFullYear();
  return `${docMeta(type).prefix}-${y}-${String(db.counters[type]).padStart(3,'0')}`;
}

function renderDocList(type){
  let docs = db.documents.filter(d=>d.type===type).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const isBl = type==='bl';
  let toolbarHtml = '';
  if(isBl){
    const today = todayISO();
    // recherche par n° de suivi (scan ou saisie) : si une recherche est active, on cherche
    // dans tout l'historique, pas seulement les livraisons du jour, pour retrouver le colis
    // même s'il a été livré il y a plusieurs jours.
    const q = blSearchQuery.trim().toLowerCase();
    if(q){
      docs = docs.filter(d=>{
        const c = db.contacts.find(c=>c.id===d.contactId);
        return (d.numeroSuivi||'').toLowerCase().includes(q) ||
          (d.number||'').toLowerCase().includes(q) ||
          (c && c.nom || d.clientLabel || '').toLowerCase().includes(q);
      });
    } else {
      if(!blShowAllHistory) docs = docs.filter(d=>d.date===today);
    }
    if(blFilterStatus==='retard') docs = docs.filter(d=>blIsLate(d));
    else if(blFilterStatus!=='all') docs = docs.filter(d=>d.status===blFilterStatus);
    const countRetard = db.documents.filter(d=>d.type==='bl' && blIsLate(d)).length;
    const countHistorique = db.documents.filter(d=>d.type==='bl' && d.date!==today).length;
    toolbarHtml = `
      <div class="toolbar">
        <div class="filters" style="flex:1;">
          <div style="display:flex;gap:6px;align-items:center;flex:1;max-width:320px;">
            <input type="text" id="blSearchInput" value="${escAttr(blSearchQuery)}" placeholder="N° de suivi, colis ou client..." style="flex:1;">
            <button type="button" class="btn small secondary" id="blSearchScanBtn" title="Scanner un colis avec la caméra">📷</button>
          </div>
          <select id="blFilterStatus">
            <option value="all" ${blFilterStatus==='all'?'selected':''}>Tous les statuts</option>
            <option value="brouillon" ${blFilterStatus==='brouillon'?'selected':''}>Brouillon</option>
            <option value="valide" ${blFilterStatus==='valide'?'selected':''}>Validé</option>
            <option value="envoye" ${blFilterStatus==='envoye'?'selected':''}>En livraison</option>
            <option value="paye" ${blFilterStatus==='paye'?'selected':''}>Livrée</option>
            <option value="refuse" ${blFilterStatus==='refuse'?'selected':''}>Refusée</option>
            <option value="absent" ${blFilterStatus==='absent'?'selected':''}>Absent</option>
            <option value="reporte" ${blFilterStatus==='reporte'?'selected':''}>Reportée</option>
            <option value="retard" ${blFilterStatus==='retard'?'selected':''}>En retard${countRetard?' ('+countRetard+')':''}</option>
          </select>
        </div>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--slate);font-weight:600;cursor:pointer;">
          <input type="checkbox" id="blShowAllHistory" ${blShowAllHistory?'checked':''}>
          Voir l'historique${countHistorique?' ('+countHistorique+')':''}
        </label>
      </div>
      ${q ? `<p style="font-size:11.5px;color:var(--muted);margin:-8px 0 14px;">Recherche « ${esc(blSearchQuery)} » sur tout l'historique — ${docs.length} résultat(s).</p>`
        : (!blShowAllHistory ? `<p style="font-size:11.5px;color:var(--muted);margin:-8px 0 14px;">Seules les livraisons du jour (${fmtDate(today)}) sont listées ici${countHistorique?' — '+countHistorique+' livraison(s) plus ancienne(s) dans l\'historique':''}. Coche « Voir l'historique » pour les retrouver, ou scanne/tape un n° de suivi ci-dessus.</p>` : '')}`;
  }
  if(!docs.length) return toolbarHtml + `<div class="empty"><b>Aucun document</b>${isBl && blFilterStatus!=='all' ? 'Aucune livraison ne correspond à ce filtre.' : (isBl ? 'Aucune livraison prévue aujourd\'hui.' : 'Crée ton premier '+docMeta(type).singular.toLowerCase()+'.')}</div>`;
  return toolbarHtml + `<table class="grid">
    <tr><th>Numéro</th><th>Tiers</th><th>Date</th>${isBl?'<th>Transporteur</th><th>N° suivi</th><th>Livraison</th>':''}<th>Statut</th><th>Total TTC</th><th></th></tr>
    ${docs.map(d=>{
      const c = db.contacts.find(c=>c.id===d.contactId);
      const clientCell = c ? esc(c.nom) : (d.clientLabel ? esc(d.clientLabel)+' <span style="color:var(--muted);font-size:11px;">(Dolibarr, non lié)</span>' : '—');
      let livraisonCell;
      if(d.status==='refuse'){
        livraisonCell = 'Refusée' + (d.dateLivraisonReelle ? ' le '+fmtDate(d.dateLivraisonReelle) : '') + (d.motifRefus ? ` <span style="color:var(--muted);font-size:11px;">(${esc(d.motifRefus)})</span>` : '');
      } else if(d.status==='absent'){
        livraisonCell = 'Client absent' + (d.dateLivraisonReelle ? ' le '+fmtDate(d.dateLivraisonReelle) : '') + (d.motifRefus ? ` <span style="color:var(--muted);font-size:11px;">(${esc(d.motifRefus)})</span>` : '');
      } else if(d.status==='reporte'){
        livraisonCell = 'Reportée' + (d.dateLivraisonPrevue ? ' au '+fmtDate(d.dateLivraisonPrevue) : '');
      } else if(d.dateLivraisonReelle){
        livraisonCell = 'Livré le '+fmtDate(d.dateLivraisonReelle);
      } else if(d.dateLivraisonPrevue){
        livraisonCell = 'Prévue '+fmtDate(d.dateLivraisonPrevue) + (blIsLate(d) ? ' <span class="pill retard" style="margin-left:4px;">⏰ En retard</span>' : '');
      } else {
        livraisonCell = '—';
      }
      return `<tr>
        <td style="font-family:var(--mono)">${d.number}</td>
        <td>${clientCell}</td>
        <td>${fmtDate(d.date)}</td>
        ${isBl?`<td>${esc(d.transporteur||'—')}</td><td style="font-family:var(--mono)">${esc(d.numeroSuivi||'—')}</td><td>${livraisonCell}</td>`:''}
        <td>${statusPill(d.status, d.type)}</td>
        <td style="font-family:var(--mono)">${fmtMoney(docTotals(d).ttc)}${(type==='facture'||type==='devis') && d.montantVerse ? `<br><span style="font-size:10.5px;color:var(--good);font-weight:600;">${({acompte:'Acompte',partiel:'Versé partiel',solde:'Soldé'})[d.typePaiement]||'Versé'} : ${fmtMoney(d.montantVerse)}</span>` : ''}</td>
        <td style="text-align:right;white-space:nowrap;">
          <button class="btn small secondary open-doc" data-id="${d.id}">Ouvrir</button>
          <button class="btn small danger del-doc" data-id="${d.id}">Suppr.</button>
        </td>
      </tr>`;
    }).join('')}
  </table>`;
}

function bindDocListFilters(){
  const sel = document.getElementById('blFilterStatus');
  if(sel) sel.onchange = ()=>{ blFilterStatus = sel.value; render(); };
  const hist = document.getElementById('blShowAllHistory');
  if(hist) hist.onchange = ()=>{ blShowAllHistory = hist.checked; render(); };
  const searchInput = document.getElementById('blSearchInput');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{ blSearchQuery = searchInput.value; blSearchFocused = true; render(); });
    searchInput.addEventListener('blur', ()=>{ blSearchFocused = false; });
    // ne remet le focus après un re-render que si l'utilisateur était bien en train d'y taper
    // (sinon un simple changement de filtre ferait apparaître le clavier sans raison)
    if(blSearchFocused){
      searchInput.focus();
      const val = searchInput.value; searchInput.value=''; searchInput.value = val;
    }
  }
  const scanBtn = document.getElementById('blSearchScanBtn');
  if(scanBtn) scanBtn.onclick = ()=>{
    scanBarcodeWithCamera(code=>{ blSearchQuery = code; render(); });
  };
}

function openDocEditor(id, type){
  const existing = id ? db.documents.find(d=>d.id===id) : null;
  const d = existing || { id:uid(), type, number: nextNumber(type), date: todayISO(), contactId:'', status:'brouillon', lines:[ {desc:'', qty:1, price:0, tva:20} ], notes:'' };
  let workingLines = JSON.parse(JSON.stringify(d.lines));

  function linesHtml(){
    return workingLines.map((l,i)=>`
      <tr>
        <td><input class="ln-desc" data-i="${i}" value="${escAttr(l.desc)}" placeholder="Désignation"></td>
        <td class="qty-col"><input class="ln-qty" data-i="${i}" type="number" step="0.01" value="${l.qty}"></td>
        <td class="price-col"><input class="ln-price" data-i="${i}" type="number" step="0.01" value="${l.price}"></td>
        <td class="tva-col"><input class="ln-tva" data-i="${i}" type="number" step="0.1" value="${l.tva}"></td>
        <td class="total-col" style="font-family:var(--mono);text-align:right;">${fmtMoney((l.qty||0)*(l.price||0))}</td>
        <td><button class="btn small danger ln-del" data-i="${i}">✕</button></td>
      </tr>`).join('');
  }
  function totalsHtml(){
    const t = docTotals({lines:workingLines});
    return `
      <div class="row"><span>Total HT</span><span>${fmtMoney(t.ht)}</span></div>
      <div class="row"><span>Total TVA</span><span>${fmtMoney(t.tva)}</span></div>
      <div class="row grand"><span>Total TTC</span><span>${fmtMoney(t.ttc)}</span></div>`;
  }

  modal(`
    <h2>${docMeta(type).singular} ${d.number}</h2>
    ${d.source==='dolibarr' && d.clientLabel && !d.contactId ? `<div style="font-size:11.5px;color:var(--muted);margin:-6px 0 14px;">Importé depuis Dolibarr — client Dolibarr : <b>${esc(d.clientLabel)}</b> (aucun contact local associé, sélectionne-le ci-dessous si besoin).</div>` : ''}
    <div class="doc-head">
      <div class="grid2" style="flex:1;">
        <div class="field"><label>Tiers</label>
          <select id="f_contact">
            <option value="">— Sélectionner —</option>
            ${db.contacts.map(c=>`<option value="${c.id}" ${d.contactId===c.id?'selected':''}>${esc(c.nom)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Date</label><input id="f_date" type="date" value="${d.date}"></div>
      </div>
    </div>
    <div class="field"><label>Statut</label>
      <select id="f_status">
        <option value="brouillon" ${d.status==='brouillon'?'selected':''}>Brouillon</option>
        <option value="valide" ${d.status==='valide'?'selected':''}>Validé</option>
        <option value="envoye" ${d.status==='envoye'?'selected':''}>${type==='bl'?'En livraison':'Envoyé'}</option>
        <option value="paye" ${d.status==='paye'?'selected':''}>${type==='bl'?'Livrée':'Payé'}</option>
        ${type==='bl' ? `
        <option value="refuse" ${d.status==='refuse'?'selected':''}>Refusée par le client</option>
        <option value="absent" ${d.status==='absent'?'selected':''}>Absent (client non présent)</option>
        <option value="reporte" ${d.status==='reporte'?'selected':''}>Reportée</option>` : ''}
      </select>
    </div>
    ${type==='facture' ? `
    <div class="card" style="padding:14px 16px;margin-bottom:16px;background:#faf9f5;">
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);margin-bottom:10px;">Paiement</div>
      <div class="grid2">
        <div class="field"><label>Type de paiement</label>
          <select id="f_typePaiement">
            <option value="aucun" ${(d.typePaiement||'aucun')==='aucun'?'selected':''}>Aucun paiement reçu</option>
            <option value="acompte" ${d.typePaiement==='acompte'?'selected':''}>Acompte versé</option>
            <option value="partiel" ${d.typePaiement==='partiel'?'selected':''}>Paiement partiel</option>
            <option value="solde" ${d.typePaiement==='solde'?'selected':''}>Payée en totalité (soldée)</option>
          </select>
        </div>
        <div class="field"><label>Montant déjà versé (€ TTC)</label><input id="f_montantVerse" type="number" step="0.01" value="${d.montantVerse||0}"></div>
      </div>
      <div id="resteAPayerBox" style="font-size:12.5px;color:var(--slate);font-weight:600;margin-top:4px;"></div>
    </div>` : ''}
    ${type==='devis' ? `
    <div class="card" style="padding:14px 16px;margin-bottom:16px;background:#faf9f5;">
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);margin-bottom:10px;">Signature & acompte</div>
      <div class="grid2">
        <div class="field"><label>Type de paiement</label>
          <select id="f_typePaiement">
            <option value="aucun" ${(d.typePaiement||'aucun')==='aucun'?'selected':''}>Aucun paiement</option>
            <option value="acompte" ${d.typePaiement==='acompte'?'selected':''}>Acompte versé</option>
            <option value="partiel" ${d.typePaiement==='partiel'?'selected':''}>Paiement partiel</option>
            <option value="solde" ${d.typePaiement==='solde'?'selected':''}>Payé en totalité</option>
          </select>
        </div>
        <div class="field"><label>Montant versé (€ TTC)</label><input id="f_montantVerse" type="number" step="0.01" value="${d.montantVerse||0}"></div>
      </div>
      <div id="resteAPayerBox" style="font-size:12.5px;color:var(--slate);font-weight:600;margin-top:4px;"></div>
      <div class="sig-label" style="margin-top:10px;">Signature du client (bon pour accord)</div>
      <div class="sig-wrap">
        <canvas id="sigDevis" width="500" height="180"></canvas>
      </div>
      <button type="button" class="btn small secondary" id="clearSigDevisBtn" style="margin-top:8px;">Effacer la signature</button>
    </div>` : ''}
    ${type==='bl' ? `
    <div class="card" style="padding:14px 16px;margin-bottom:16px;background:#faf9f5;">
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--slate);margin-bottom:10px;">Livraison</div>
      <div class="grid2">
        <div class="field"><label>Transporteur</label><input id="f_transporteur" value="${escAttr(d.transporteur||'')}" placeholder="ex : Colissimo, transporteur interne..."></div>
        <div class="field"><label>N° de suivi</label>
          <div style="display:flex;gap:6px;">
            <input id="f_suivi" value="${escAttr(d.numeroSuivi||'')}" placeholder="Scanner ou saisir le code" style="flex:1;">
            <button type="button" class="btn small secondary" id="camScanBtn" title="Scanner avec la caméra">📷</button>
          </div>
          <div id="scanHint" style="font-size:10.5px;color:var(--muted);margin-top:3px;">🔊 Place le curseur ici et scanne le colis avec ta douchette (USB/Bluetooth), ou utilise 📷.</div>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>Date de livraison prévue</label><input id="f_datePrevue" type="date" value="${escAttr(d.dateLivraisonPrevue||'')}"></div>
        <div class="field"><label>Date de livraison réelle</label><input id="f_dateReelle" type="date" value="${escAttr(d.dateLivraisonReelle||'')}"></div>
      </div>
      <div class="field"><label>Adresse de livraison (si différente du tiers)</label><textarea id="f_adresseLivraison" rows="2" placeholder="Laisser vide pour utiliser l'adresse du tiers">${esc(d.adresseLivraison||'')}</textarea></div>
      <div class="field"><label>Motif / note (si refusée ou client absent)</label><input id="f_motifRefus" value="${escAttr(d.motifRefus||'')}" placeholder="Ex : produit endommagé, colis incomplet, client injoignable..."></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px;">
        <button type="button" class="btn small secondary" id="blMarkDelivered">✓ Marquer livrée</button>
        <button type="button" class="btn small danger" id="blMarkRefused">✕ Refuser la livraison</button>
        <button type="button" class="btn small danger" id="blMarkAbsent">⦻ Client absent</button>
        <button type="button" class="btn small secondary" id="blMarkPostponed">↻ Reporter</button>
      </div>
      <div class="sig-label">Signature du client (preuve de livraison)</div>
      <div class="sig-wrap">
        <canvas id="sigLivraison" width="500" height="180"></canvas>
      </div>
      <button type="button" class="btn small secondary" id="clearSigLivraisonBtn" style="margin-top:8px;">Effacer la signature</button>
      <p style="font-size:11px;color:var(--muted);margin:8px 0 0;">Signée avec le doigt (mobile) ou la souris au moment de la remise. Elle est intégrée au PDF exporté et jointe à l'expédition Dolibarr lors de la synchro soir.</p>

      <div class="sig-label" style="margin-top:16px;">Photo de la livraison (colis remis / emplacement)</div>
      <div id="photoLivraisonPreview" style="margin-bottom:8px;">
        ${d.photoLivraison ? `<div class="gallery-item" style="display:inline-block;position:relative;"><img src="${d.photoLivraison}" style="max-width:180px;border-radius:5px;border:1px solid var(--line);display:block;"><button type="button" class="btn small danger" id="rmPhotoLivraisonBtn" style="margin-top:6px;">✕ Retirer la photo</button></div>` : `<span style="font-size:12px;color:var(--muted);">Aucune photo pour le moment.</span>`}
      </div>
      <label class="file-btn btn small secondary" style="display:inline-block;cursor:pointer;">📷 ${d.photoLivraison?'Remplacer la photo':'Ajouter une photo'}
        <input type="file" accept="image/*" capture="environment" id="photoLivraisonInput" style="display:none;">
      </label>
      <p style="font-size:11px;color:var(--muted);margin:8px 0 0;">Comme la signature, cette photo est jointe à l'expédition Dolibarr et ajoutée au PDF de preuve de livraison.</p>
      ${d.dolibarrId ? `<div style="font-size:11.5px;color:var(--muted);margin-top:8px;">⇅ Synchronisé avec Dolibarr — commande n°${esc(d.dolibarrOrderId||'—')}, expédition n°${esc(d.dolibarrId)}${d.dolibarrSyncedAt?' · '+fmtDate(d.dolibarrSyncedAt):''}.</div>
        ${d.dolibarrProofSyncError ? `<div style="font-size:11.5px;color:#a13a2f;margin-top:6px;">⚠ ${esc(d.dolibarrProofSyncError)}</div>` : (d.dolibarrProofSynced ? `<div style="font-size:11.5px;color:var(--good);margin-top:6px;">✓ Signature/photo/preuve et statut bien transmis à Dolibarr${d.dolibarrProofSyncedAt?' ('+fmtDate(d.dolibarrProofSyncedAt)+')':''}.</div>` : '')}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
          ${['paye','refuse','absent','reporte'].includes(d.status) ? `<button type="button" class="btn small secondary" id="forceResyncBtn">↻ Renvoyer maintenant vers Dolibarr</button>` : ''}
          <button type="button" class="btn small danger" id="clearDolibarrSyncBtn">🗑 Supprimer la synchro</button>
        </div>
      ` : `<div style="font-size:11.5px;color:var(--muted);margin-top:8px;">Pas encore transféré vers Dolibarr (se fait via « Synchro soir », page Ticket Z).</div>
        <button type="button" class="btn small secondary" id="pushNowBtn" style="margin-top:8px;">⇪ Envoyer maintenant vers Dolibarr</button>
      `}
    </div>` : ''}

    <table class="grid lines-table" style="margin-top:10px;">
      <tr><th>Désignation</th><th class="qty-col">Qté</th><th class="price-col">PU HT</th><th class="tva-col">TVA%</th><th class="total-col">Total HT</th><th></th></tr>
      <tbody id="linesBody">${linesHtml()}</tbody>
    </table>
    <div style="margin-top:8px;">
      <select id="quickProduct" style="margin-right:8px;">
        <option value="">+ Ajouter depuis catalogue produit...</option>
        ${db.products.map(p=>`<option value="${p.id}">${esc(p.nom)} — ${fmtMoney(p.prix)}</option>`).join('')}
      </select>
      <button class="btn small secondary" id="addLineBtn">+ Ligne vide</button>
    </div>

    <div class="totals-box" id="totalsBox">${totalsHtml()}</div>

    <div class="field" style="margin-top:14px;"><label>Notes / mentions</label><textarea id="f_notes" rows="2">${esc(d.notes||'')}</textarea></div>

    <div class="export-row">
      <span style="font-size:12px;color:var(--muted);font-weight:600;">Format d'export :</span>
      <div class="format-choice">
        <button type="button" id="fmtA4" class="active">A4 (210×297mm)</button>
        <button type="button" id="fmtLabel">101×152mm</button>
      </div>
      <button class="btn secondary" id="exportPdfBtn">↓ Exporter PDF</button>
    </div>

    <div class="modal-actions">
      ${existing?`<button class="btn danger" id="delBtn" style="margin-right:auto;">Supprimer</button>`:''}
      <button class="btn secondary" id="cancelBtn">Fermer</button>
      <button class="btn accent" id="saveBtn">Enregistrer</button>
    </div>
  `);

  let selectedFormat = 'a4';
  document.getElementById('fmtA4').onclick = ()=>{ selectedFormat='a4'; document.getElementById('fmtA4').classList.add('active'); document.getElementById('fmtLabel').classList.remove('active'); };
  document.getElementById('fmtLabel').onclick = ()=>{ selectedFormat='label'; document.getElementById('fmtLabel').classList.add('active'); document.getElementById('fmtA4').classList.remove('active'); };

  let wSignatureClient = d.signatureClient || null;
  let wPhotoLivraison = d.photoLivraison || null;
  if(type==='bl'){
    function refreshPhotoLivraisonBlock(){
      const box = document.getElementById('photoLivraisonPreview');
      box.innerHTML = wPhotoLivraison
        ? `<div class="gallery-item" style="display:inline-block;position:relative;"><img src="${wPhotoLivraison}" style="max-width:180px;border-radius:5px;border:1px solid var(--line);display:block;"><button type="button" class="btn small danger" id="rmPhotoLivraisonBtn" style="margin-top:6px;">✕ Retirer la photo</button></div>`
        : `<span style="font-size:12px;color:var(--muted);">Aucune photo pour le moment.</span>`;
      const rm = document.getElementById('rmPhotoLivraisonBtn');
      if(rm) rm.onclick = ()=>{ wPhotoLivraison = null; refreshPhotoLivraisonBlock(); };
    }
    document.getElementById('photoLivraisonInput').onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        wPhotoLivraison = await fileToCompressedDataURL(file);
        refreshPhotoLivraisonBlock();
      }catch(err){ alert("Impossible de lire cette image."); }
      e.target.value = '';
    };
    const padLivraison = setupSignaturePad('sigLivraison', wSignatureClient, (dataUrl)=>{
      wSignatureClient = dataUrl;
      // dès qu'une signature est capturée, on considère la livraison faite : passage auto en "Livrée"
      // (sauf si elle a déjà été explicitement marquée refusée ou reportée)
      if(dataUrl){
        const statusSel = document.getElementById('f_status');
        const dateReelle = document.getElementById('f_dateReelle');
        if(statusSel && ['brouillon','valide','envoye'].includes(statusSel.value)) statusSel.value = 'paye';
        if(dateReelle && !dateReelle.value) dateReelle.value = todayISO();
      }
    });
    document.getElementById('clearSigLivraisonBtn').onclick = ()=> padLivraison.clear();

    const forceResyncBtn = document.getElementById('forceResyncBtn');
    if(forceResyncBtn){
      forceResyncBtn.onclick = async ()=>{
        // On enregistre d'abord l'état courant du formulaire (signature/photo/statut compris), pour
        // être sûr de pousser vers Dolibarr exactement ce qui est affiché à l'écran.
        const obj = buildDocObject();
        const idx = db.documents.findIndex(x=>x.id===obj.id);
        if(idx>=0) db.documents[idx]=obj; else db.documents.push(obj);
        save();
        forceResyncBtn.disabled = true;
        forceResyncBtn.textContent = '⏳ Envoi en cours...';
        try{
          await pushDeliveryProofToDolibarr(obj);
          alert(`${obj.number} : synchronisé avec succès vers Dolibarr (signature/photo/preuve + statut).`);
        }catch(e){
          alert(`${obj.number} : échec de la synchro Dolibarr — ${e.message}`);
        }
        closeModal(); render(); openDocEditor(obj.id, 'bl');
      };
    }

    // ---- Supprime le lien Dolibarr de ce BL (aucune suppression côté Dolibarr : on efface juste
    //      les infos de synchro locales) pour pouvoir repartir sur une expédition Dolibarr toute
    //      neuve — utile en cas de doublon, de synchro ratée, ou d'expédition supprimée côté Dolibarr. ----
    const clearDolibarrSyncBtn = document.getElementById('clearDolibarrSyncBtn');
    if(clearDolibarrSyncBtn){
      clearDolibarrSyncBtn.onclick = ()=>{
        if(!confirm(`Supprimer le lien de synchro Dolibarr de ${d.number} ?\n\nRien n'est supprimé côté Dolibarr (la commande/expédition existante y reste telle quelle) : on efface juste la liaison locale, pour pouvoir renvoyer ce BL comme une nouvelle expédition Dolibarr.`)) return;
        const obj = buildDocObject();
        obj.dolibarrId = null; obj.dolibarrRef = null; obj.dolibarrOrderId = null;
        obj.dolibarrSynced = false; obj.dolibarrSyncedAt = null;
        obj.dolibarrProofSynced = false; obj.dolibarrProofSyncedAt = null; obj.dolibarrProofSyncError = null;
        obj.dolibarrLastPushedStatus = null;
        const idx = db.documents.findIndex(x=>x.id===obj.id);
        if(idx>=0) db.documents[idx]=obj; else db.documents.push(obj);
        save();
        closeModal(); render(); openDocEditor(obj.id, 'bl');
      };
    }

    // ---- Envoie ce BL vers Dolibarr tout de suite (nouvelle commande + expédition), sans attendre
    //      la synchro soir automatique (qui ne traite que les BL datés du jour même). ----
    const pushNowBtn = document.getElementById('pushNowBtn');
    if(pushNowBtn){
      pushNowBtn.onclick = async ()=>{
        const obj = buildDocObject();
        const idx = db.documents.findIndex(x=>x.id===obj.id);
        if(idx>=0) db.documents[idx]=obj; else db.documents.push(obj);
        save();
        pushNowBtn.disabled = true;
        pushNowBtn.textContent = '⏳ Envoi en cours...';
        try{
          await pushBLToDolibarr(obj);
          alert(`${obj.number} : transféré avec succès vers Dolibarr (commande + expédition créées).`);
        }catch(e){
          alert(`${obj.number} : échec du transfert vers Dolibarr — ${e.message}`);
        }
        closeModal(); render(); openDocEditor(obj.id, 'bl');
      };
    }

    document.getElementById('blMarkDelivered').onclick = ()=>{
      document.getElementById('f_status').value = 'paye';
      if(!document.getElementById('f_dateReelle').value) document.getElementById('f_dateReelle').value = todayISO();
    };
    document.getElementById('blMarkRefused').onclick = ()=>{
      document.getElementById('f_status').value = 'refuse';
      if(!document.getElementById('f_dateReelle').value) document.getElementById('f_dateReelle').value = todayISO();
      const motifField = document.getElementById('f_motifRefus');
      const motif = prompt('Motif du refus (optionnel) :', motifField.value||'');
      if(motif!==null) motifField.value = motif;
    };
    document.getElementById('blMarkAbsent').onclick = ()=>{
      document.getElementById('f_status').value = 'absent';
      if(!document.getElementById('f_dateReelle').value) document.getElementById('f_dateReelle').value = todayISO();
      const motifField = document.getElementById('f_motifRefus');
      const motif = prompt('Note sur l\'absence du client (optionnel) :', motifField.value||'');
      if(motif!==null) motifField.value = motif;
    };
    document.getElementById('blMarkPostponed').onclick = ()=>{
      document.getElementById('f_status').value = 'reporte';
      const dateField = document.getElementById('f_datePrevue');
      const nv = prompt('Nouvelle date de livraison prévue (AAAA-MM-JJ) :', dateField.value||'');
      if(nv) dateField.value = nv;
    };

    // --- Lecteur de code-barre (douchette USB/Bluetooth = clavier + Entrée) ---
    const suiviInput = document.getElementById('f_suivi');
    suiviInput.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        playBeep(1600, 0.1);
        suiviInput.blur(); suiviInput.focus();
      }
    });

    // --- Scan via caméra (si le navigateur le permet) ---
    document.getElementById('camScanBtn').onclick = ()=>{
      scanBarcodeWithCamera(code=>{ suiviInput.value = code; });
    };
  }

  let wSignatureDevis = d.signatureClient || null;
  if(type==='devis'){
    const padDevis = setupSignaturePad('sigDevis', wSignatureDevis, (dataUrl)=>{ wSignatureDevis = dataUrl; });
    document.getElementById('clearSigDevisBtn').onclick = ()=> padDevis.clear();
  }

  function refreshResteAPayer(){
    const box = document.getElementById('resteAPayerBox');
    if(!box) return;
    const ttc = docTotals({lines:workingLines}).ttc;
    const verse = parseFloat(document.getElementById('f_montantVerse').value)||0;
    const reste = Math.max(0, ttc - verse);
    box.textContent = `Reste à payer : ${fmtMoney(reste)} (sur ${fmtMoney(ttc)} TTC)`;
  }
  if(type==='facture' || type==='devis'){
    document.getElementById('f_montantVerse').addEventListener('input', refreshResteAPayer);
    refreshResteAPayer();
  }

  function refreshLines(){
    document.getElementById('linesBody').innerHTML = linesHtml();
    document.getElementById('totalsBox').innerHTML = totalsHtml();
    bindLineInputs();
    refreshResteAPayer();
  }
  function bindLineInputs(){
    document.querySelectorAll('.ln-desc').forEach(el=>el.oninput = e=>{ workingLines[e.target.dataset.i].desc = e.target.value; });
    document.querySelectorAll('.ln-qty').forEach(el=>el.oninput = e=>{ workingLines[e.target.dataset.i].qty = parseFloat(e.target.value)||0; document.getElementById('totalsBox').innerHTML=totalsHtml(); refreshRowTotal(e.target.dataset.i); refreshResteAPayer(); });
    document.querySelectorAll('.ln-price').forEach(el=>el.oninput = e=>{ workingLines[e.target.dataset.i].price = parseFloat(e.target.value)||0; document.getElementById('totalsBox').innerHTML=totalsHtml(); refreshRowTotal(e.target.dataset.i); refreshResteAPayer(); });
    document.querySelectorAll('.ln-tva').forEach(el=>el.oninput = e=>{ workingLines[e.target.dataset.i].tva = parseFloat(e.target.value)||0; document.getElementById('totalsBox').innerHTML=totalsHtml(); refreshResteAPayer(); });
    document.querySelectorAll('.ln-del').forEach(el=>el.onclick = e=>{ workingLines.splice(e.target.dataset.i,1); if(!workingLines.length) workingLines.push({desc:'',qty:1,price:0,tva:20}); refreshLines(); });
  }
  function refreshRowTotal(i){
    const row = document.querySelectorAll('.ln-qty')[i].closest('tr');

    db.documents = db.documents.filter(x=>x.id!==id); save(); closeModal(); render();

      transporteur: val('f_transporteur'),

      motifRefus: val('f_motifRefus'),

      photoLivraison: wPhotoLivraison,
      clientLabel: d.clientLabel,
      dolibarrOrderId: d.dolibarrOrderId, dolibarrId: d.dolibarrId, dolibarrRef: d.dolibarrRef,

      dolibarrProofSynced: d.dolibarrProofSynced, dolibarrProofSyncedAt: d.dolibarrProofSyncedAt,
      dolibarrLastPushedStatus: d.dolibarrLastPushedStatus
    } : type==='facture' ? {
      typePaiement: val('f_typePaiement'),
      montantVerse: parseFloat(val('f_montantVerse'))||0
    } : type==='devis' ? {
      typePaiement: val('f_typePaiement'),
      montantVerse: parseFloat(val('f_montantVerse'))||0,
      signatureClient: wSignatureDevis
    } : {};
    return Object.assign({
      id: d.id, type, number: d.number,
      date: val('f_date'), contactId: val('f_contact'),
      status: val('f_status'), notes: val('f_notes'),
      lines: workingLines.filter(l=>l.desc.trim()!=='' || l.qty || l.price)
    }, extra);
  }

  document.getElementById('saveBtn').onclick = ()=>{
    const obj = buildDocObject();
    const idx = db.documents.findIndex(x=>x.id===obj.id);
    if(idx>=0) db.documents[idx]=obj; else db.documents.push(obj);
    save(); closeModal(); render();
  };
  document.getElementById('exportPdfBtn').onclick = ()=>{
    const obj = buildDocObject();
    exportDocPdf(obj, selectedFormat);
  };
}

/* ============================================================
   EXPORT PDF (A4 ou 101x152mm)
   ============================================================ */
function exportDocPdf(d, format, opts){
  opts = opts || {};
  const { jsPDF } = window.jspdf;
  const contact = db.contacts.find(c=>c.id===d.contactId);
  const totals = docTotals(d);
  const meta = docMeta(d.type);

  const pageFormat = format==='label' ? [101,152] : 'a4';
  const doc = new jsPDF({ unit:'mm', format: pageFormat });
  const W = doc.internal.pageSize.getWidth();
  const small = format==='label';
  const margin = small ? 5 : 15;
  let y = margin;
  const fs = (base)=> small ? Math.max(6, base-2) : base;

  // En-tête société
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(13));
  doc.text(db.company.nom || 'Société', margin, y); y+= small?4.5:6;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(8.5));
  (db.company.adresse||'').split('\n').forEach(line=>{ doc.text(line, margin, y); y+=small?3.4:4; });
  if(db.company.siret) { doc.text('SIRET: '+db.company.siret, margin, y); y+=small?3.4:4; }
  if(db.company.tel) { doc.text('Tél: '+db.company.tel, margin, y); y+=small?3.4:4; }

  // Titre document (aligné droite en A4, en dessous en label)
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(15));
  const title = `${meta.singular.toUpperCase()} ${d.number}`;
  if(small){
    y+=2; doc.text(title, margin, y); y+=5;
  } else {
    doc.text(title, W-margin, margin+6, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text('Date : '+fmtDate(d.date), W-margin, margin+13, {align:'right'});
    doc.text('Statut : '+(({brouillon:'Brouillon',valide:'Validé',envoye: d.type==='bl'?'En livraison':'Envoyé',paye: d.type==='bl'?'Livrée':'Payé',refuse:'Refusée',absent:'Client absent',reporte:'Reportée'})[d.status]||d.status||''), W-margin, margin+19, {align:'right'});
  }
  if(small){
    doc.setFontSize(fs(8));
    doc.text('Date: '+fmtDate(d.date), margin, y); y+=3.4;
  }

  y = Math.max(y, small? y : margin+26);
  y += small?2:4;

  // Bloc tiers
  doc.setDrawColor(200); doc.line(margin, y, W-margin, y); y+= small?4:7;
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(9));
  doc.text(d.type==='bl' ? 'Livré à :' : 'Client :', margin, y); y+= small?3.6:5;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(9));
  if(contact){
    doc.text(contact.nom||'', margin, y); y+= small?3.4:4.5;
    (contact.adresse||'').split('\n').forEach(l=>{ if(l.trim()){ doc.text(l, margin, y); y+= small?3.4:4.5; }});
    const cpVille = [contact.codePostal, contact.ville].filter(Boolean).join(' ');
    if(cpVille){ doc.text(cpVille, margin, y); y+= small?3.4:4.5; }
  } else {
    doc.text('—', margin, y); y+=small?3.4:4.5;
  }
  y += small?2:4;

  // Table des lignes
  const head = small ? [['Désig.','Qté','PU','Total']] : [['Désignation','Qté','PU HT','TVA','Total HT']];
  const bodyRows = d.lines.map(l=>{
    const lineTotal = (l.qty||0)*(l.price||0);
    return small
      ? [l.desc, String(l.qty), fmtMoney(l.price), fmtMoney(lineTotal)]
      : [l.desc, String(l.qty), fmtMoney(l.price), (l.tva||0)+'%', fmtMoney(lineTotal)];
  });

  doc.autoTable({
    startY: y,
    head, body: bodyRows,
    margin: { left: margin, right: margin },
    styles: { fontSize: fs(small?7:9), cellPadding: small?1.2:2.5, font:'helvetica' },
    headStyles: { fillColor: [22,26,35], textColor: 255, fontStyle:'bold' },
    columnStyles: small
      ? { 0:{cellWidth:'auto'}, 1:{cellWidth:12,halign:'right'}, 2:{cellWidth:18,halign:'right'}, 3:{cellWidth:20,halign:'right'} }
      : { 1:{halign:'right'}, 2:{halign:'right'}, 3:{halign:'right'}, 4:{halign:'right'} },
  });

  let finalY = doc.lastAutoTable.finalY + (small?4:8);
  const boxW = small ? W-margin*2 : 70;
  const boxX = small ? margin : W-margin-boxW;

  doc.setFontSize(fs(small?7.5:9));
  function totalLine(label, value, bold){
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.text(label, boxX, finalY);
    doc.text(value, boxX+boxW, finalY, {align:'right'});
    finalY += small?3.6:5.5;
  }
  totalLine('Total HT', fmtMoney(totals.ht), false);
  totalLine('Total TVA', fmtMoney(totals.tva), false);
  totalLine('TOTAL TTC', fmtMoney(totals.ttc), true);

  if((d.type==='facture' || d.type==='devis') && d.montantVerse){
    const label = ({acompte:'Acompte versé', partiel:'Déjà versé (partiel)', solde:'Payé (soldé)'})[d.typePaiement] || 'Déjà versé';
    totalLine(label, fmtMoney(d.montantVerse), false);
    totalLine('Reste à payer', fmtMoney(Math.max(0, totals.ttc - d.montantVerse)), true);
  }

  if(d.notes){
    finalY += small?2:4;
    doc.setFont('helvetica','italic'); doc.setFontSize(fs(small?7:8.5));
    const split = doc.splitTextToSize(d.notes, W-margin*2);
    doc.text(split, margin, finalY);
    finalY += split.length * (small?3:4);
  }

  // Preuve de livraison : signature client (BL uniquement)
  if(d.type==='bl' && d.signatureClient){
    finalY += small?4:8;
    if(finalY + (small?26:38) > doc.internal.pageSize.getHeight() - margin){ doc.addPage(); finalY = margin; }
    doc.setDrawColor(200); doc.line(margin, finalY, W-margin, finalY); finalY += small?4:6;
    doc.setFont('helvetica','bold'); doc.setFontSize(fs(small?8:10));
    doc.text('PREUVE DE LIVRAISON', margin, finalY); finalY += small?4:6;
    doc.setFont('helvetica','normal'); doc.setFontSize(fs(small?7:8.5));
    doc.text('Signature du client attestant la réception de la livraison :', margin, finalY); finalY += small?3:4.5;
    if(d.dateLivraisonReelle) { doc.text('Livré le : '+fmtDate(d.dateLivraisonReelle), margin, finalY); finalY += small?3:4.5; }
    const sigW = small ? 45 : 60, sigH = small ? 16 : 22;
    try{ doc.addImage(d.signatureClient, 'PNG', margin, finalY, sigW, sigH); }catch(e){}
    doc.setDrawColor(120); doc.rect(margin, finalY, sigW, sigH);
    if(d.photoLivraison){
      const photoX = margin + sigW + (small?6:10);
      try{
        const fmtPhoto = /^data:image\/png/i.test(d.photoLivraison) ? 'PNG' : 'JPEG';
        doc.addImage(d.photoLivraison, fmtPhoto, photoX, finalY, sigH, sigH);
        doc.setDrawColor(120); doc.rect(photoX, finalY, sigH, sigH);
      }catch(e){}
    }
    finalY += sigH;
  }

  // Signature client (devis) : bon pour accord
  if(d.type==='devis' && d.signatureClient){
    finalY += small?4:8;
    if(finalY + (small?26:38) > doc.internal.pageSize.getHeight() - margin){ doc.addPage(); finalY = margin; }
    doc.setDrawColor(200); doc.line(margin, finalY, W-margin, finalY); finalY += small?4:6;
    doc.setFont('helvetica','bold'); doc.setFontSize(fs(small?8:10));
    doc.text('BON POUR ACCORD', margin, finalY); finalY += small?4:6;
    doc.setFont('helvetica','normal'); doc.setFontSize(fs(small?7:8.5));
    doc.text('Signature du client :', margin, finalY); finalY += small?3:4.5;
    const sigW = small ? 45 : 60, sigH = small ? 16 : 22;
    try{ doc.addImage(d.signatureClient, 'PNG', margin, finalY, sigW, sigH); }catch(e){}
    doc.setDrawColor(120); doc.rect(margin, finalY, sigW, sigH);
  }

  if(opts.returnDataUrl) return doc.output('datauristring');

  const filename = `${d.number}_${format}.pdf`;
  doc.save(filename);
}

// compresse une image (fichier) en dataURL JPEG redimensionnée, pour limiter la taille en localStorage
function fileToCompressedDataURL(file, maxDim=1100, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          const ratio = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w*ratio); h = Math.round(h*ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// pad de signature réutilisable (contrats + interventions)
function setupSignaturePad(canvasId, initialDataUrl, onChange){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#161a23';
  if(initialDataUrl){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src = initialDataUrl;
  }
  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx * (canvas.width/rect.width), y: cy * (canvas.height/rect.height) };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); onChange(canvas.toDataURL('image/png')); e.preventDefault(); }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return { clear(){ ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); onChange(null); } };
}
