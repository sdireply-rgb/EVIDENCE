      }catch(err){ alert("Impossible de lire cette image."); }
    };
  });

  function renderGallery(){
    document.getElementById('galleryWrap').innerHTML = wPhotos.gallery.map((p,i)=>`
      <div class="gallery-item">
        <img src="${p}">
        <button type="button" class="rm" data-i="${i}">✕</button>
      </div>`).join('');
    document.querySelectorAll('.gallery-item .rm').forEach(b=>{
      b.onclick = ()=>{ wPhotos.gallery.splice(b.dataset.i,1); renderGallery(); };
    });
  }
  renderGallery();
  document.getElementById('galleryInput').onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const dataUrl = await fileToCompressedDataURL(file);
      wPhotos.gallery.push(dataUrl);
      renderGallery();
    }catch(err){ alert("Impossible de lire cette image."); }
    e.target.value = '';
  };

  // --- signature pads ---
  const padVendeur = setupSignaturePad('sigVendeur', wSig.vendeur, (d)=>{ wSig.vendeur = d; });
  const padClient = setupSignaturePad('sigClient', wSig.client, (d)=>{ wSig.client = d; });
  document.getElementById('clearVendeur').onclick = ()=> padVendeur.clear();
  document.getElementById('clearClient').onclick = ()=> padClient.clear();

  function buildContractObject(){
    return {
      id: ct.id, number: ct.number,
      date: val('ct_date'), contactId: val('ct_contact'),
      objet: val('ct_objet'), montant: parseFloat(val('ct_montant'))||0,
      lieu: val('ct_lieu'), conditions: val('ct_conditions'), status: val('ct_status'),
      dolibarrRef: val('ct_dolref').trim(),
      dolibarrId: ct.dolibarrId, dolibarrSynced: ct.dolibarrSynced, dolibarrSyncedAt: ct.dolibarrSyncedAt,
      photos: wPhotos, signatures: wSig
    };
  }

  document.getElementById('cancelBtn').onclick = closeModal;
  if(existing) document.getElementById('delBtn').onclick = ()=>{
    if(confirm('Supprimer ce contrat ?')){ db.contracts = db.contracts.filter(x=>x.id!==id); save(); closeModal(); render(); }
  };
  document.getElementById('saveBtn').onclick = ()=>{
    const obj = buildContractObject();
    if(!obj.objet.trim()){ alert("L'objet du contrat est requis."); return; }
    const idx = db.contracts.findIndex(x=>x.id===obj.id);
    if(idx>=0) db.contracts[idx]=obj; else db.contracts.push(obj);
    save(); closeModal(); render();
  };
  document.getElementById('exportContractBtn').onclick = ()=>{
    exportContractPdf(buildContractObject(), ctFormat);
  };
}

function exportContractPdf(ct, format){
  const { jsPDF } = window.jspdf;
  const contact = db.contacts.find(c=>c.id===ct.contactId);
  const small = format==='label';
  const pageFormatArg = small ? [101,152] : 'a4';
  const doc = new jsPDF({ unit:'mm', format: pageFormatArg });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const margin = small ? 5 : 15;
  const bottomLimit = H - margin;
  const fs = (base)=> small ? Math.max(6, base-2) : base;
  let y = margin;

  function newPage(){ doc.addPage(pageFormatArg==='a4' ? 'a4' : pageFormatArg); y = margin; }
  function ensure(h){ if(y + h > bottomLimit){ newPage(); } }
  function text(str, x, opts){ doc.text(String(str), x, y, opts||{}); }
  function para(str, x, maxW, lineH){
    const lines = doc.splitTextToSize(str, maxW);
    lines.forEach(line=>{ ensure(lineH); doc.text(line, x, y); y += lineH; });
  }

  // en-tête
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(13));
  text(db.company.nom || 'Société', margin); y += small?4.5:6;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(8.5));
  (db.company.adresse||'').split('\n').forEach(line=>{ if(line.trim()){ text(line, margin); y+=small?3.4:4; }});
  if(db.company.siret){ text('SIRET: '+db.company.siret, margin); y+=small?3.4:4; }
  y += small?1:3;

  doc.setFont('helvetica','bold'); doc.setFontSize(fs(14));
  text('CONTRAT DE VENTE', margin); y+= small?4.6:7;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(9));
  text('N° '+ct.number+'   —   Date : '+fmtDate(ct.date), margin); y+= small?3.6:5;
  if(ct.lieu){ text('Lieu de signature : '+ct.lieu, margin); y+= small?3.6:5; }
  y += small?1.5:3;
  doc.setDrawColor(200); doc.line(margin, y, W-margin, y); y+= small?4:6;

  // parties
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(9.5));
  text('ENTRE LES SOUSSIGNÉS :', margin); y+= small?4:6;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(9));
  text('Le Vendeur : '+(db.company.nom||''), margin); y+= small?3.6:5;
  text("L'Acheteur : "+(contact?contact.nom:'—'), margin); y+= small?3.6:5;
  if(contact){
    const addr = [contact.adresse, [contact.codePostal, contact.ville].filter(Boolean).join(' ')].filter(Boolean).join(' — ');
    if(addr){ para(addr, margin, W-margin*2, small?3.4:4.5); }
    if(contact.tel){ text('Tél : '+contact.tel, margin); y+= small?3.4:4.5; }
  }
  y += small?2:4;

  // objet + montant
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(9.5));
  ensure(small?4:6); text('OBJET DU CONTRAT :', margin); y+= small?4:6;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(9));
  para(ct.objet||'—', margin, W-margin*2, small?3.4:4.5);
  y += small?1:2;
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(10));
  ensure(small?4:6); text('Montant convenu : '+fmtMoney(ct.montant), margin); y+= small?5:8;

  // conditions
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(9.5));
  ensure(small?4:6); text('CONDITIONS GÉNÉRALES :', margin); y+= small?4:6;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(small?7.5:8.5));
  para(ct.conditions||'', margin, W-margin*2, small?3.2:4.2);
  y += small?3:6;

  // photos jointes (uniquement en A4 pour rester lisible ; en label on liste juste ce qui est joint)
  const photoList = [];
  if(ct.photos){
    if(ct.photos.cni_recto) photoList.push({label:'CNI recto', src:ct.photos.cni_recto});
    if(ct.photos.cni_verso) photoList.push({label:'CNI verso', src:ct.photos.cni_verso});
    (ct.photos.gallery||[]).forEach((p,i)=> photoList.push({label:'Photo '+(i+1), src:p}));
  }
  if(photoList.length){
    doc.setFont('helvetica','bold'); doc.setFontSize(fs(9.5));
    ensure(small?5:8); text('PIÈCES JOINTES :', margin); y+= small?4:7;
    if(small){
      doc.setFont('helvetica','normal'); doc.setFontSize(fs(7.5));
      photoList.forEach(p=>{ ensure(3.4); text('• '+p.label+' (jointe au dossier numérique)', margin); y+=3.4; });
      y += 2;
    } else {
      const imgW = 55, imgH = 40, gap = 8;
      let x = margin, rowH = 0, colCount = 0;
      photoList.forEach(p=>{
        ensure(imgH+10);
        if(colCount>0 && x + imgW > W-margin){ x = margin; y += rowH + 10; colCount = 0; ensure(imgH+10); }
        try{ doc.addImage(p.src, 'JPEG', x, y, imgW, imgH); }catch(e){}
        doc.setFontSize(7.5); doc.text(p.label, x, y+imgH+4);
        x += imgW + gap; colCount++; rowH = imgH;
      });
      y += imgH + 14;
    }
  }

  // signatures
  const sigW = small ? (W-margin*2-6)/2 : 75, sigH = small?18:26;
  ensure(sigH + (small?14:22));
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(9));
  const xLeft = margin, xRight = small ? margin + sigW + 6 : W - margin - sigW;
  text('Signature du vendeur :', xLeft); 
  const yLabel = y;
  doc.text('Signature de l\'acheteur :', xRight, yLabel);
  y += small?2:3;
  const ySig = y;
  if(ct.signatures && ct.signatures.vendeur){ try{ doc.addImage(ct.signatures.vendeur, 'PNG', xLeft, ySig, sigW, sigH); }catch(e){} } 
  else { doc.setDrawColor(210); doc.rect(xLeft, ySig, sigW, sigH); }
  if(ct.signatures && ct.signatures.client){ try{ doc.addImage(ct.signatures.client, 'PNG', xRight, ySig, sigW, sigH); }catch(e){} }
  else { doc.setDrawColor(210); doc.rect(xRight, ySig, sigW, sigH); }
  y = ySig + sigH + (small?3:6);
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(7.5));
  text('Bon pour accord', xLeft); doc.text('Bon pour accord', xRight, y);

  doc.save(`${ct.number}_${format}.pdf`);
}

/* ============================================================
   RENDEZ-VOUS
   ============================================================ */
let rdvView = 'liste'; // 'liste' | 'semaine'
let rdvWeekOffset = 0;
let rdvSelected = new Set(); // ids des RDV cochés pour suppression en masse

function appointmentStatusLabel(s){ return ({planifie:'Planifié', confirme:'Confirmé', termine:'Terminé', annule:'Annulé'})[s] || s; }
function appointmentStatusPillClass(s){ return ({planifie:'brouillon', confirme:'envoye', termine:'paye', annule:'brouillon'})[s] || 'brouillon'; }

function renderAppointments(){
  // on ne garde en sélection que des ids de RDV qui existent toujours
  rdvSelected.forEach(id=>{ if(!db.appointments.find(a=>a.id===id)) rdvSelected.delete(id); });
  const nbSel = rdvSelected.size;
  const toolbar = `
    <div class="toolbar">
      <div class="filters">
        <button class="btn small ${rdvView==='liste'?'':'secondary'}" id="rdvViewListe">Liste</button>
        <button class="btn small ${rdvView==='semaine'?'':'secondary'}" id="rdvViewSemaine">Semaine</button>
      </div>
      ${rdvView==='liste' && db.appointments.length ? `
      <div class="filters" style="margin-left:auto;">
        ${nbSel>0 ? `<span style="font-size:11.5px;color:var(--muted);align-self:center;">${nbSel} sélectionné(s)</span>` : ''}
        <button class="btn small danger" id="rdvDeleteSelectedBtn" ${nbSel===0?'disabled':''}>🗑 Supprimer la sélection${nbSel>0?` (${nbSel})`:''}</button>
        <button class="btn small danger" id="rdvDeleteAllBtn">🗑 Supprimer tous les RDV</button>
      </div>` : ''}
    </div>`;
  return toolbar + (rdvView==='liste' ? renderAppointmentsList() : renderAppointmentsWeek());
}

function renderAppointmentsList(){
  if(!db.appointments.length) return `<div class="empty"><b>Aucun rendez-vous</b>Planifie ton premier rendez-vous.</div>`;
  const list = [...db.appointments].sort((a,b)=> (a.date+((a.heure)||'00:00')).localeCompare(b.date+((b.heure)||'00:00')));
  const allChecked = list.length>0 && list.every(r=>rdvSelected.has(r.id));
  return `<table class="grid">
    <tr>
      <th style="width:26px;"><input type="checkbox" id="rdvSelectAll" ${allChecked?'checked':''}></th>
      <th>Date</th><th>Heure</th><th>Contact</th><th>Objet</th><th>Lieu</th><th>Statut</th><th></th>
    </tr>
    ${list.map(r=>{
      const c = db.contacts.find(c=>c.id===r.contactId);
      const objetAff = r.objet || r.titre || '';
      const clientAff = c ? c.nom : (r.clientLabel || '—');
      const checked = rdvSelected.has(r.id);
      return `<tr>
        <td><input type="checkbox" class="rdv-check" data-id="${r.id}" ${checked?'checked':''}></td>
        <td>${fmtDate(r.date)}</td>
        <td style="font-family:var(--mono)">${r.heure||'—'}</td>
        <td>${esc(clientAff)}</td>
        <td>${esc(objetAff.slice(0,36))}${objetAff.length>36?'…':''}</td>
        <td>${esc(r.lieu||'—')}</td>
        <td><span class="pill ${appointmentStatusPillClass(r.status)}">${appointmentStatusLabel(r.status)}</span></td>
        <td style="text-align:right;white-space:nowrap;">
          <button class="btn small secondary edit-rdv" data-id="${r.id}">Éditer</button>
          <button class="btn small secondary ics-rdv" data-id="${r.id}">↓ .ics</button>
          <button class="btn small danger del-rdv" data-id="${r.id}">Suppr.</button>
        </td>
      </tr>`;
    }).join('')}
  </table>`;
}

function startOfWeek(d){
  const dt = new Date(d);
  const day = (dt.getDay()+6)%7; // lundi = 0
  dt.setDate(dt.getDate()-day);
  dt.setHours(0,0,0,0);
  return dt;
}
function renderAppointmentsWeek(){
  const base = new Date();
  base.setDate(base.getDate() + rdvWeekOffset*7);
  const monday = startOfWeek(base);
  const days = [...Array(7)].map((_,i)=>{ const d = new Date(monday); d.setDate(d.getDate()+i); return d; });
  const jours = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

  const cards = days.map((d,i)=>{
    const iso = d.toISOString().slice(0,10);
    const dayAppts = db.appointments.filter(a=>a.date===iso).sort((a,b)=>(a.heure||'').localeCompare(b.heure||''));
    return `<div class="card" style="padding:10px;min-height:140px;">
      <div style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px;">${jours[i]} ${d.getDate()}/${d.getMonth()+1}</div>
      ${dayAppts.map(a=>{
        const c = db.contacts.find(c=>c.id===a.contactId);
        const objetAff = a.objet || a.titre || '';
        const clientAff = c ? c.nom : (a.clientLabel || '');
        return `<div class="rdv-chip edit-rdv" data-id="${a.id}" style="cursor:pointer;background:var(--accent-soft);border-radius:4px;padding:5px 7px;margin-bottom:5px;font-size:11.5px;">
          <b>${a.heure||''}</b> ${esc(clientAff)}<br><span style="color:var(--muted);">${esc(objetAff.slice(0,26))}</span>
        </div>`;
      }).join('') || `<div style="font-size:11px;color:#c4c0b2;">—</div>`}
    </div>`;
  }).join('');

  return `
    <div class="toolbar" style="margin-top:-4px;">
      <div class="filters">
        <button class="btn small secondary" id="rdvPrevWeek">‹ Semaine préc.</button>
        <button class="btn small secondary" id="rdvTodayWeek">Aujourd'hui</button>
        <button class="btn small secondary" id="rdvNextWeek">Semaine suiv. ›</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;">${cards}</div>
  `;
}

function bindAppointmentView(){
  const listeBtn = document.getElementById('rdvViewListe');
  const semaineBtn = document.getElementById('rdvViewSemaine');
  if(listeBtn) listeBtn.onclick = ()=>{ rdvView='liste'; render(); };
  if(semaineBtn) semaineBtn.onclick = ()=>{ rdvView='semaine'; render(); };
  const prev = document.getElementById('rdvPrevWeek');
  const next = document.getElementById('rdvNextWeek');
  const tod = document.getElementById('rdvTodayWeek');
  if(prev) prev.onclick = ()=>{ rdvWeekOffset--; render(); };
  if(next) next.onclick = ()=>{ rdvWeekOffset++; render(); };
  if(tod) tod.onclick = ()=>{ rdvWeekOffset=0; render(); };
  document.querySelectorAll('.edit-rdv').forEach(el=>el.onclick=()=>openAppointmentModal(el.dataset.id));
  document.querySelectorAll('.del-rdv').forEach(el=>el.onclick=()=>{ if(confirm('Supprimer ce rendez-vous ?')){ db.appointments=db.appointments.filter(a=>a.id!==el.dataset.id); rdvSelected.delete(el.dataset.id); save(); render(); } });
  document.querySelectorAll('.ics-rdv').forEach(el=>el.onclick=()=>exportAppointmentIcs(db.appointments.find(a=>a.id===el.dataset.id)));

  // ---- Sélection multiple + suppression en masse ----
  document.querySelectorAll('.rdv-check').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); };
    el.onchange = ()=>{
      if(el.checked) rdvSelected.add(el.dataset.id); else rdvSelected.delete(el.dataset.id);
      render();
    };
  });
  const selectAll = document.getElementById('rdvSelectAll');
  if(selectAll){
    selectAll.onclick = (e)=> e.stopPropagation();
    selectAll.onchange = ()=>{
      const list = [...db.appointments].sort((a,b)=> (a.date+((a.heure)||'00:00')).localeCompare(b.date+((b.heure)||'00:00')));
      if(selectAll.checked) list.forEach(r=>rdvSelected.add(r.id));
      else list.forEach(r=>rdvSelected.delete(r.id));
      render();
    };
  }
  const deleteSelectedBtn = document.getElementById('rdvDeleteSelectedBtn');
  if(deleteSelectedBtn){
    deleteSelectedBtn.onclick = ()=>{
      const n = rdvSelected.size;
      if(n===0) return;
      if(!confirm(`Supprimer les ${n} rendez-vous sélectionné(s) d'Evidence ?\n\nCeci ne supprime rien côté Dolibarr : seuls les RDV importés localement dans Evidence sont retirés (ils pourront être réimportés à la prochaine synchro si tu ne les supprimes pas aussi côté Dolibarr).`)) return;
      db.appointments = db.appointments.filter(a=>!rdvSelected.has(a.id));
      rdvSelected.clear();
      save(); render();
    };
  }
  const deleteAllBtn = document.getElementById('rdvDeleteAllBtn');
  if(deleteAllBtn){
    deleteAllBtn.onclick = ()=>{
      const n = db.appointments.length;
      if(n===0) return;
      if(!confirm(`⚠ Supprimer TOUS les rendez-vous (${n}) d'Evidence ?\n\nCette action est irréversible côté Evidence et ne touche pas Dolibarr : les RDV importés depuis Dolibarr pourront revenir à la prochaine synchro si tu ne les supprimes pas aussi là-bas.\n\nConfirmer la suppression complète ?`)) return;
      db.appointments = [];
      rdvSelected.clear();
      save(); render();
    };
  }
}

function openAppointmentModal(id){
  const existing = id ? db.appointments.find(a=>a.id===id) : null;
  const r = existing || { id:uid(), contactId:'', date: todayISO(), heure:'09:00', duree:30, objet:'', lieu:'', status:'planifie', notes:'' };
  const objetInit = r.objet || r.titre || '';
  modal(`
    <h2>${existing?'Modifier le rendez-vous':'Nouveau rendez-vous'}</h2>
    ${existing && existing.source==='dolibarr' ? `<div style="font-size:11.5px;color:var(--muted);margin:-6px 0 14px;">Importé depuis Dolibarr${existing.clientLabel && !existing.contactId ? ' — client Dolibarr : <b>'+esc(existing.clientLabel)+'</b> (aucun contact local associé, sélectionne-le ci-dessous si besoin)' : ''}.</div>` : ''}
    <div class="grid2">
      <div class="field"><label>Contact</label>
        <select id="r_contact">
          <option value="">— Sélectionner —</option>
          ${db.contacts.map(c=>`<option value="${c.id}" ${r.contactId===c.id?'selected':''}>${esc(c.nom)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Objet</label><input id="r_objet" value="${escAttr(objetInit)}" placeholder="Ex : Visite technique"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Date</label><input id="r_date" type="date" value="${r.date}"></div>
      <div class="field"><label>Heure</label><input id="r_heure" type="time" value="${r.heure||'09:00'}"></div>
      <div class="field"><label>Durée (min)</label><input id="r_duree" type="number" step="5" value="${r.duree||30}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Lieu</label><input id="r_lieu" value="${escAttr(r.lieu)}"></div>
      <div class="field"><label>Statut</label>
        <select id="r_status">
          <option value="planifie" ${r.status==='planifie'?'selected':''}>Planifié</option>
          <option value="confirme" ${r.status==='confirme'?'selected':''}>Confirmé</option>
          <option value="termine" ${r.status==='termine'?'selected':''}>Terminé</option>
          <option value="annule" ${r.status==='annule'?'selected':''}>Annulé</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="r_notes" rows="3">${esc(r.notes||'')}</textarea></div>
    <div class="modal-actions">
      ${existing?`<button class="btn danger" id="delBtn" style="margin-right:auto;">Supprimer</button>`:''}
      <button class="btn secondary" id="icsBtn">↓ Exporter .ics</button>
      <button class="btn secondary" id="cancelBtn">Fermer</button>
      <button class="btn accent" id="saveBtn">Enregistrer</button>
    </div>
  `);
  document.getElementById('cancelBtn').onclick = closeModal;
  if(existing) document.getElementById('delBtn').onclick = ()=>{ db.appointments = db.appointments.filter(x=>x.id!==id); save(); closeModal(); render(); };
  function buildObj(){
    return { id:r.id, contactId: val('r_contact'), date: val('r_date'), heure: val('r_heure'), duree: parseInt(val('r_duree'))||30, objet: val('r_objet'), lieu: val('r_lieu'), status: val('r_status'), notes: val('r_notes'),
      // on conserve le lien Dolibarr existant (source, id, infos de synchro) : sans ça, éditer un RDV
      // importé de Dolibarr le transformait en "nouveau RDV local" et le faisait renvoyer en double.
      source: r.source, dolibarrId: r.dolibarrId, dolibarrSynced: r.dolibarrSynced, dolibarrSyncedAt: r.dolibarrSyncedAt };
  }
  document.getElementById('icsBtn').onclick = ()=> exportAppointmentIcs(buildObj());
  document.getElementById('saveBtn').onclick = async ()=>{
    const obj = buildObj();
    if(!obj.date){ alert('La date est requise.'); return; }
    if(obj.status==='termine'){
      // Un RDV marqué "Terminé" ne doit plus vivre dans Evidence : on l'envoie (ou on le met à jour)
      // vers Dolibarr, puis on le retire d'ici — il reste consultable uniquement dans l'agenda Dolibarr.
      const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'Envoi vers Dolibarr...';
      try{
        await pushAppointmentToDolibarr(obj);
        db.appointments = db.appointments.filter(x=>x.id!==obj.id);
        save(); closeModal(); render();
        return;
      }catch(e){
        alert(`RDV marqué terminé mais impossible de le transférer vers Dolibarr (${e.message}). Il reste visible dans Evidence en attendant ; réessaie une fois le souci résolu (ou relance la Synchro soir).`);
        btn.disabled = false; btn.textContent = 'Enregistrer';
        // on l'enregistre quand même localement avec le statut "terminé" pour ne rien perdre,
        // la synchro soir le retentera et le retirera dès que l'envoi réussira.
      }
    }
    const idx = db.appointments.findIndex(x=>x.id===obj.id);
    if(idx>=0) db.appointments[idx]=obj; else db.appointments.push(obj);
    save(); closeModal(); render();
  };
}

function exportAppointmentIcs(r){
  const c = db.contacts.find(c=>c.id===r.contactId);
  const [hh,mm] = (r.heure||'09:00').split(':');
  const startDt = new Date(r.date+'T'+(r.heure||'09:00')+':00');
  const endDt = new Date(startDt.getTime() + (r.duree||30)*60000);
  const fmt = (d)=> d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Evidence CRM//FR','BEGIN:VEVENT',
    'UID:'+r.id+'@evidence',
    'DTSTAMP:'+fmt(new Date()),
    'DTSTART:'+fmt(startDt),
    'DTEND:'+fmt(endDt),
    'SUMMARY:'+(r.objet||'Rendez-vous')+(c?' - '+c.nom:''),
    'LOCATION:'+(r.lieu||''),
    'DESCRIPTION:'+(r.notes||'').replace(/\n/g,'\\n'),
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rdv_'+r.date+'.ics';
  a.click();
}

function interventionNextNumber(){
  db.counters.intervention = (db.counters.intervention||0)+1;
  const y = new Date().getFullYear();
  return `INT-${y}-${String(db.counters.intervention).padStart(3,'0')}`;
}
function interventionStatusLabel(s){ return ({planifiee:'Planifiée', en_cours:'En cours', terminee:'Terminée'})[s] || s; }
function interventionStatusPillClass(s){ return ({planifiee:'brouillon', en_cours:'envoye', terminee:'paye'})[s] || 'brouillon'; }
function interventionTotals(it){
  let ht=0, tva=0;
  (it.lines||[]).forEach(l=>{ const lineHt=(l.qty||0)*(l.price||0); ht+=lineHt; tva+=lineHt*((l.tva||0)/100); });
  return { ht, tva, ttc: ht+tva };
}

function renderInterventionList(){
  if(!db.interventions.length) return `<div class="empty"><b>Aucune intervention</b>Crée ta première fiche d'intervention.</div>`;
  const list = [...db.interventions].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `<table class="grid">
    <tr><th>Numéro</th><th>Client</th><th>Description</th><th>Date</th><th>Technicien</th><th>Statut</th><th></th></tr>
    ${list.map(it=>{
      const c = db.contacts.find(c=>c.id===it.contactId);
      return `<tr>
        <td style="font-family:var(--mono)">${it.number}</td>
        <td>${c?esc(c.nom):'—'}</td>
        <td>${esc((it.description||'').slice(0,36))}${(it.description||'').length>36?'…':''}</td>
        <td>${fmtDate(it.date)}</td>
        <td>${esc(it.technicien||'—')}</td>
        <td><span class="pill ${interventionStatusPillClass(it.status)}">${interventionStatusLabel(it.status)}</span></td>
        <td style="text-align:right;white-space:nowrap;">
          <button class="btn small secondary open-intervention" data-id="${it.id}">Ouvrir</button>
          <button class="btn small danger del-intervention" data-id="${it.id}">Suppr.</button>
        </td>
      </tr>`;
    }).join('')}
  </table>`;
}

function exportInterventionPdf(it, format){
  const { jsPDF } = window.jspdf;
  const contact = db.contacts.find(c=>c.id===it.contactId);
  const totals = interventionTotals(it);
  const small = format==='label';
  const pageFormatArg = small ? [101,152] : 'a4';
  const doc = new jsPDF({ unit:'mm', format: pageFormatArg });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const margin = small ? 5 : 15;
  const bottomLimit = H - margin;
  const fs = (base)=> small ? Math.max(6, base-2) : base;
  let y = margin;
  function newPage(){ doc.addPage(pageFormatArg); y = margin; }
  function ensure(h){ if(y + h > bottomLimit){ newPage(); } }
  function text(str, x, opts){ doc.text(String(str), x, y, opts||{}); }
  function para(str, x, maxW, lineH){
    doc.splitTextToSize(str, maxW).forEach(line=>{ ensure(lineH); doc.text(line, x, y); y += lineH; });
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(fs(13));
  text(db.company.nom || 'Société', margin); y += small?4.5:6;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(8.5));
  (db.company.adresse||'').split('\n').forEach(l=>{ if(l.trim()){ text(l, margin); y+=small?3.4:4; }});
  y += small?1:3;

  doc.setFont('helvetica','bold'); doc.setFontSize(fs(14));
  text("BON D'INTERVENTION", margin); y+= small?4.6:7;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(9));
  text('N° '+it.number+'   —   '+fmtDate(it.date)+' '+(it.heure||''), margin); y+= small?3.6:5;
  if(it.technicien){ text('Technicien : '+it.technicien, margin); y+= small?3.6:5; }
  text('Durée : '+(it.dureeHeures||0)+' h', margin); y+= small?3.6:5;
  y += small?1.5:3;
  doc.setDrawColor(200); doc.line(margin, y, W-margin, y); y+= small?4:6;

  doc.setFont('helvetica','bold'); doc.setFontSize(fs(9.5));
  ensure(small?4:6); text('CLIENT :', margin); y+= small?4:6;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(9));
  text(contact?contact.nom:'—', margin); y+= small?3.6:5;
  if(contact){
    const addr = [contact.adresse, [contact.codePostal, contact.ville].filter(Boolean).join(' ')].filter(Boolean).join(' — ');
    if(addr) para(addr, margin, W-margin*2, small?3.4:4.5);
  }
  y += small?2:4;

  doc.setFont('helvetica','bold'); doc.setFontSize(fs(9.5));
  ensure(small?4:6); text('DESCRIPTION :', margin); y+= small?4:6;
  doc.setFont('helvetica','normal'); doc.setFontSize(fs(9));
  para(it.description||'—', margin, W-margin*2, small?3.4:4.5);
  y += small?2:4;

  if(it.lines && it.lines.length){
    const head = small ? [['Désig.','Qté','PU','Total']] : [['Désignation','Qté','PU HT','TVA','Total HT']];
    const body = it.lines.map(l=>{
      const lt = (l.qty||0)*(l.price||0);
      return small ? [l.desc, String(l.qty), fmtMoney(l.price), fmtMoney(lt)] : [l.desc, String(l.qty), fmtMoney(l.price), (l.tva||0)+'%', fmtMoney(lt)];
    });
    ensure(20);
    doc.autoTable({
      startY: y, head, body, margin:{left:margin, right:margin},
      styles:{ fontSize: fs(small?7:9), cellPadding: small?1.2:2.5, font:'helvetica' },
      headStyles:{ fillColor:[22,26,35], textColor:255, fontStyle:'bold' },
    });
    y = doc.lastAutoTable.finalY + (small?4:8);
    doc.setFont('helvetica','bold'); doc.setFontSize(fs(small?8:10));
    ensure(6); text('Total TTC pièces/prestations : '+fmtMoney(totals.ttc), margin); y+= small?5:8;
  }

  const photoList = [];
  (it.photos?.avant||[]).forEach((p,i)=>photoList.push({label:'Avant '+(i+1), src:p}));
  (it.photos?.apres||[]).forEach((p,i)=>photoList.push({label:'Après '+(i+1), src:p}));
  if(photoList.length){
    doc.setFont('helvetica','bold'); doc.setFontSize(fs(9.5));
    ensure(small?5:8); text('PHOTOS :', margin); y+= small?4:7;
    if(small){
      doc.setFont('helvetica','normal'); doc.setFontSize(fs(7.5));
      photoList.forEach(p=>{ ensure(3.4); text('• '+p.label+' (jointe au dossier numérique)', margin); y+=3.4; });
      y+=2;
    } else {
      const imgW=55, imgH=40, gap=8; let x=margin, colCount=0;
      photoList.forEach(p=>{
        ensure(imgH+10);
        if(colCount>0 && x+imgW>W-margin){ x=margin; y+=imgH+10; colCount=0; ensure(imgH+10); }
        try{ doc.addImage(p.src,'JPEG',x,y,imgW,imgH); }catch(e){}
        doc.setFontSize(7.5); doc.text(p.label, x, y+imgH+4);
        x+=imgW+gap; colCount++;
      });
      y+=imgH+14;
    }
  }

  const sigW = small ? W-margin*2 : 80, sigH = small?18:26;
  ensure(sigH+(small?12:18));
  doc.setFont('helvetica','bold'); doc.setFontSize(fs(9));
  text('Signature du client (bon pour intervention réalisée) :', margin); y+= small?2:3;
  const ySig = y;
  if(it.signatureClient){ try{ doc.addImage(it.signatureClient,'PNG',margin,ySig,sigW,sigH); }catch(e){} }
  else { doc.setDrawColor(210); doc.rect(margin, ySig, sigW, sigH); }
  y = ySig + sigH + (small?3:5);

  doc.save(`${it.number}_${format}.pdf`);
}

/* ============================================================
   SYNCHRONISATION DOLIBARR
   - Matin  : récupère les événements d'agenda (RDV prévus) depuis Dolibarr
   - Soir   : transfère devis / factures / interventions du jour vers Dolibarr
   Nécessite dans Dolibarr : module "API REST" activé, une clé API générée
   sur la fiche utilisateur, et le CORS autorisé côté serveur Dolibarr
   (sinon le navigateur bloquera les requêtes vers un autre domaine).
   ============================================================ */
function dolLog(type, msg){
  db.dolibarr.log = db.dolibarr.log || [];
  db.dolibarr.log.unshift({ ts: new Date().toISOString(), type, msg });
  db.dolibarr.log = db.dolibarr.log.slice(0, 80);
  save();
}
async function dolFetch(path, options={}){
  const cfg = db.dolibarr;
  if(!cfg.url) throw new Error("URL de l'API Dolibarr non configurée (Paramètres).");
  if(!cfg.apiKey) throw new Error("Clé API Dolibarr non configurée (Paramètres).");
  const base = cfg.url.replace(/\/+$/,'');
  if(!/\/api\/index\.php$/i.test(base)){
    // avertissement doux dans le journal, on tente quand même l'appel
    dolLog('info', `L'URL Dolibarr configurée ("${base}") ne se termine pas par /api/index.php — c'est le format généralement attendu. Vérifie Paramètres > Synchronisation Dolibarr si les appels échouent.`);
  }
  let res;
  try{
    res = await fetch(base+path, {
      method: options.method || 'GET',
      headers: Object.assign({ 'DOLAPIKEY': cfg.apiKey, 'Content-Type':'application/json' }, options.headers||{}),
      body: options.body!==undefined ? JSON.stringify(options.body) : undefined
    });
  }catch(networkErr){
    // fetch échoue avant même d'atteindre le serveur : mauvaise URL, HTTPS/certificat invalide,
    // serveur injoignable, ou (le plus fréquent) le serveur Dolibarr ne renvoie pas les en-têtes
    // CORS nécessaires pour autoriser cette appli web à l'appeler directement depuis le navigateur.
    throw new Error(`Impossible de joindre l'API Dolibarr à "${base}" (${networkErr.message}). Causes les plus fréquentes : URL incorrecte, certificat HTTPS invalide, ou serveur Dolibarr qui ne renvoie pas les en-têtes CORS (Access-Control-Allow-Origin) nécessaires pour être appelé depuis un navigateur.`);
  }
  const raw = await res.text();
  let data = null;
  try{ data = raw ? JSON.parse(raw) : null; }catch(e){ data = raw; }
  if(!res.ok){
    let msg = (data && data.error && data.error.message) ? data.error.message : (typeof data==='string' ? data : ('HTTP '+res.status));
    if(typeof data==='string' && /<html/i.test(data)){
      msg = `HTTP ${res.status} — le serveur a renvoyé une page HTML au lieu de JSON (souvent : mauvaise URL, module "API REST" désactivé côté Dolibarr, ou redirection vers une page de connexion).`;
    }
    throw new Error(msg);
  }
  if(typeof data==='string' && /<html/i.test(data)){
    throw new Error("Réponse HTML reçue au lieu de JSON — vérifie que l'URL se termine par /api/index.php et que le module « API REST » est activé côté Dolibarr.");
  }
  return data;
}
function dolUnixToISO(ts){
  // Selon la version/config de Dolibarr, l'API peut renvoyer soit un timestamp unix (nombre de
  // secondes), soit directement une chaîne de date lisible ("2026-08-11 09:00:00" ou variantes ISO).
  // On gère les deux cas : un mauvais parsing ici faisait passer certains RDV à la trappe silencieusement.
  if(ts===null || ts===undefined || ts==='') return { date:null, heure:null };
  let dt = null;
  if(typeof ts==='number'){
    dt = new Date(ts*1000);
  } else if(typeof ts==='string'){
    const trimmed = ts.trim();
    if(/^\d{14}$/.test(trimmed)){
      // format compact "YYYYMMDDHHMMSS" que Dolibarr renvoie parfois selon la config
      // (ex: "20260811090000") — à ne pas confondre avec un timestamp unix.
      const y=trimmed.slice(0,4), mo=trimmed.slice(4,6), d=trimmed.slice(6,8),
            h=trimmed.slice(8,10), mi=trimmed.slice(10,12), s=trimmed.slice(12,14);
      dt = new Date(`${y}-${mo}-${d}T${h}:${mi}:${s}`);
    } else if(/^\d{8}$/.test(trimmed)){
      // format compact "YYYYMMDD" (date seule, sans heure)
      const y=trimmed.slice(0,4), mo=trimmed.slice(4,6), d=trimmed.slice(6,8);
      dt = new Date(`${y}-${mo}-${d}T00:00:00`);
    } else if(/^-?\d+$/.test(trimmed)){
      // chaîne purement numérique = timestamp unix envoyé sous forme de texte
      dt = new Date(parseInt(trimmed,10)*1000);
    } else {
      // chaîne de date lisible ("2026-08-11 09:00:00", "2026-08-11T09:00:00", etc.)
      const normalized = trimmed.includes('T') ? trimmed : trimmed.replace(' ', 'T');
      dt = new Date(normalized);
      if(isNaN(dt.getTime())) dt = new Date(trimmed); // dernier essai tel quel
    }
  }
  if(!dt || isNaN(dt.getTime())) return { date:null, heure:null };
  const date = dt.toISOString().slice(0,10);
  const heure = dt.toTimeString().slice(0,5);
  return { date, heure };
}

/* ---- Détecte les événements d'agenda générés automatiquement par Dolibarr (facture validée,
   paiement, commande créée, etc.) pour ne pas les importer comme s'il s'agissait de vrais
   rendez-vous. Deux niveaux de filtre :
   1) le "code" de l'événement (nom de champ variable selon la version de l'API Dolibarr, donc on
      va le chercher à plusieurs endroits possibles) ;
   2) un filet de sécurité par mots-clés dans le libellé, au cas où le code ne serait pas exploitable
      tel quel (c'était le cas ici : tout remontait comme RDV, signe que le code n'était pas détecté). ---- */
function getAgendaEventCode(ev){
  if(!ev) return '';
  const candidates = [ev.code, ev.type_code, ev.acode, ev.elementtype,
    ev.type && (ev.type.code || ev.type.id), ev.actioncode];
  const found = candidates.find(c=>c!==undefined && c!==null && String(c).trim()!=='');
  return found ? String(found).toUpperCase() : '';
}
function isSystemGeneratedAgendaEvent(ev){
  const label = (ev && (ev.label||ev.title||'')) ? String(ev.label||ev.title).toLowerCase() : '';
  // Mots-clés "objet Dolibarr" : quasiment jamais présents dans le libellé d'un vrai RDV client
  const objectKeywords = ['facture','paiement','payment','invoice','commande','devis','proposition',
    'expédition','expedition','contrat','ticket','projet','avoir','règlement','reglement',
    'prélèvement','prelevement','virement','tiers','third party','fournisseur','abonnement',
    'relance','société','societe','entreprise cliente'];
  // Verbes/actions typiques des journaux automatiques Dolibarr, quel que soit l'objet concerné
  const actionKeywords = ['créé','créée','cree','creee','modifié','modifiée','modifie','modifiee',
    'supprimé','supprimée','supprime','supprimee','validé','validée','valide','validee',
    'clôturé','clôturée','cloture','cloturee','envoyé par','envoyee par','envoyé(e)',
    'classé','classée','classe','classee','annulé','annulée','annule','annulee',
    'a été','a ete','changement de statut','statut chang'];
  if(objectKeywords.some(k=>label.includes(k))) return true;
  if(actionKeywords.some(k=>label.includes(k))) return true;
  const customKeywords = (db.dolibarr.excludeKeywords||'').split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);
  if(customKeywords.some(k=>label.includes(k))) return true;
  const code = getAgendaEventCode(ev);
  if(!code) return false; // ni code ni mot-clé suspect = événement manuel classique, on le garde
  const systemPrefixes = ['AC_FAC','AC_COM','AC_PROP','AC_SHIP','AC_ORDER','AC_CONTRACT','AC_TASK','AC_TICKET','AC_PROJET','AC_EXPENSE','AC_SO_','AC_PAY'];
  if(code==='AC_OTH_AUTO') return true; // action automatique système générique
  return systemPrefixes.some(p=>code.startsWith(p));
}
/* ---- Liste blanche : ne retient QUE les vrais RDV clients, plutôt que d'essayer d'exclure tous
   les types d'événements système possibles un par un (liste noire trop fragile — les libellés et
   codes varient selon les versions Dolibarr, et un événement système mal reconnu remontait alors
   comme un "RDV"). On n'accepte un événement que si :
   1) son filet de sécurité mots-clés/préfixes ne l'a pas déjà signalé comme automatique, ET
   2) son type est explicitement "Rendez-vous" (code AC_RDV) quand ce type est identifiable, OU,
      si le type n'est pas exploitable dans la réponse API, qu'il est au moins lié à un tiers
      (ev.socid) — un vrai RDV client est presque toujours rattaché à un tiers, contrairement à un
      événement système générique. ---- */
function isRealClientAppointment(ev){
  if(!ev) return false;
  if(isSystemGeneratedAgendaEvent(ev)) return false;
  const code = getAgendaEventCode(ev);
  if(code) return code === 'AC_RDV';
  return !!ev.socid;
}

/* ---- Matin : import des RDV Dolibarr du jour + synchro des clients Dolibarr ---- */
async function syncDolibarrMorning(dateISO){
  dateISO = dateISO || todayISO();
  // 0) on synchronise automatiquement les infos de la société (Dolibarr → Paramètres)
  await syncDolibarrCompany().catch(()=>null);
  // 1) on récupère/actualise d'abord les clients Dolibarr, pour que les RDV du jour puissent s'y relier
  const contactsResult = await syncDolibarrContacts().catch(e=>({ added:0, updated:0, error:e.message }));
  // 1bis) on récupère/actualise le catalogue produits/services Dolibarr (nouveautés incluses)
  const productsResult = await syncDolibarrProducts().catch(e=>({ added:0, updated:0, error:e.message }));
  // 2) on importe les nouveaux colis mis "en expédition" côté Dolibarr, et on rafraîchit ceux déjà connus
  const shipmentsResult = await syncDolibarrShipmentsPull().catch(e=>({ added:0, updated:0, error:e.message }));
  // 2bis) on importe les fiches d'intervention créées côté Dolibarr (sens qui manquait totalement
  // jusqu'ici : seul l'envoi Evidence → Dolibarr existait, voir pushInterventionToDolibarr).
  const interventionsResult = await syncDolibarrInterventionsPull().catch(e=>({ added:0, updated:0, error:e.message }));
  dolLog('info', `Synchro matin — recherche des RDV Dolibarr du ${dateISO}...`);
  try{
    // IMPORTANT : on n'utilise plus de filtre serveur (sqlfilters) sur t.datep pour interroger
    // /agendaevents. Ce filtre s'est avéré peu fiable selon les installs Dolibarr (retourne un
    // tableau vide, sans erreur HTTP, même quand de vrais RDV existent dans la fenêtre demandée —
    // probablement un souci de format/alias de champ côté API). On reproduit donc exactement la
    // méthode de l'import historique (syncDolibarrAppointmentsPull), qui elle fonctionne bien :
    // récupération SANS filtre serveur, tri décroissant par id (les RDV les plus récents/proches
    // en premier), puis filtrage de la fenêtre de dates côté client.
    const prevISO = new Date(new Date(dateISO+'T00:00:00').getTime() - 86400000).toISOString().slice(0,10);
    let all = [];
    let page = 0;
    const limit = 200;
    while(true){
      const batch = await dolFetch(`/agendaevents?sortfield=t.id&sortorder=DESC&limit=${limit}&page=${page}`);
      const arr = Array.isArray(batch) ? batch : [];
      if(arr.length===0) break;
      const inWindow = arr.filter(ev=>{
        const { date } = dolUnixToISO(ev.datep);
        // Pas de borne supérieure : on veut aussi les RDV créés pour dans plusieurs jours/semaines,
        // pas seulement ceux d'aujourd'hui/demain — sinon un nouveau RDV posé pour la semaine
        // prochaine n'apparaît jamais tant que sa date n'est pas "demain". Seule la borne du bas
        // (hier) reste, comme marge de sécurité fuseau horaire.
        return date && date>=prevISO;
      });
      all = all.concat(inWindow);
      // Comme on trie du plus récent au plus ancien par id (pas par date), on ne peut pas déduire
      // avec certitude qu'on a dépassé la fenêtre juste parce qu'une page n'en contient aucun —
      // un RDV ancien peut avoir été créé/modifié récemment (id élevé) avec une date passée. On
      // limite donc simplement le nombre de pages parcourues, comme le fait l'import historique.
      if(arr.length < limit) break;
      page++;
      if(page>20) break; // sécurité anti-boucle
    }
    const excluded = all.filter(ev=>!isRealClientAppointment(ev));
    const list = all.filter(ev=>isRealClientAppointment(ev));
    if(excluded.length){
      const sample = excluded.slice(0,5).map(e=>`"${e.label||''}" (code détecté: ${getAgendaEventCode(e)||'aucun'})`).join(', ');
      dolLog('info', `${excluded.length} événement(s) depuis le ${prevISO} exclu(s) car reconnu(s) comme automatique(s)/non-RDV : ${sample}${excluded.length>5?'…':''}. Si un vrai RDV a été exclu par erreur, dis-moi son libellé exact.`);
    }
    if(all.length){
      const rawSample = all.slice(0,3).map(e=>`datep brut="${e.datep}" → interprété comme "${dolUnixToISO(e.datep).date||'?'}"`).join(' | ');
      dolLog('info', `${all.length} événement(s) trouvé(s) depuis le ${prevISO} (hier + tous les RDV à venir, sans limite de date future), ${list.length} retenu(s) comme vrai(s) RDV. Échantillon : ${rawSample}`);
    }
    if(all.length===0){
      // Diagnostic : même sans filtre serveur, rien trouvé dans la fenêtre de dates. On tente un
      // appel de contrôle pour savoir si c'est (a) un vrai "pas de RDV ce jour-là", ou (b) un souci
      // de droits qui bloquerait toute lecture de l'agenda.
      try{
        const probe = await dolFetch(`/agendaevents?limit=5&sortfield=t.id&sortorder=DESC`);
        const probeArr = Array.isArray(probe) ? probe : [];
        if(probeArr.length===0){
          dolLog('info', `Diagnostic : l'API Dolibarr ne renvoie AUCUN événement d'agenda, même sans filtre de date. Cause la plus probable : le compte/clé API utilisé n'a pas le droit "Agenda → Lire tous les agendas" (ou "Lire ses propres agendas" s'il n'a aucun RDV assigné), ou le module Agenda n'est pas activé côté Dolibarr.`);
        } else {
          const sample = probeArr.slice(0,3).map(e=>`#${e.id} "${e.label||''}" (datep=${e.datep})`).join(', ');
          dolLog('info', `Diagnostic : l'API voit bien des événements (ex : ${sample}) mais aucun n'est daté du ${prevISO} ou après. Vérifie que la date des RDV côté Dolibarr est bien celle attendue, et que le fuseau horaire du serveur Dolibarr correspond à celui attendu. Augmente éventuellement le nombre de pages parcourues (variable page>20) si tu as beaucoup d'événements récents non liés à des RDV.`);
        }
      }catch(probeErr){
        dolLog('info', `Diagnostic impossible (${probeErr.message}).`);
      }
    }
    let added = 0, skipped = 0, removedDone = 0;
    list.forEach(ev=>{
      const already = db.appointments.find(a=>a.dolibarrId===String(ev.id));
      const isDone = ev.percentage>=100;
      if(already){
        // Un RDV déjà importé qui vient d'être marqué "fait" côté Dolibarr : on ne le garde plus
        // dans Evidence, il reste consultable uniquement dans l'agenda Dolibarr.
        if(isDone){ db.appointments = db.appointments.filter(a=>a.id!==already.id); removedDone++; }
        else{ skipped++; }
        return;
      }
      // Un RDV déjà terminé côté Dolibarr au moment où on le découvre : inutile de l'importer dans
      // Evidence pour l'en ressortir aussitôt, on ne veut voir ici que les RDV encore actifs.
      if(isDone){ removedDone++; return; }
      const { date, heure } = dolUnixToISO(ev.datep);
      let contactId = '';
      if(ev.socid){
        const c = db.contacts.find(c=>c.dolibarrId===String(ev.socid));
        if(c) contactId = c.id;
      }
      db.appointments.push({
        id: uid(),
        dolibarrId: String(ev.id),
        source: 'dolibarr',
        date: date || dateISO,
        heure: heure || '09:00',
        duree: 30,
        contactId,
        clientLabel: ev.socname || ev.contact || '',
        objet: ev.label || 'RDV Dolibarr',
        titre: ev.label || 'RDV Dolibarr',
        lieu: '',
        notes: ev.note_public || ev.note_private || '',
        status: 'planifie'
      });
      added++;
    });
    save();
    db.dolibarr.lastMorningSync = new Date().toISOString();
    save();
    dolLog('ok', `Synchro matin terminée : ${added} RDV importé(s), ${skipped} déjà présent(s), ${removedDone} RDV terminé(s) retiré(s) d'Evidence (consultables uniquement dans Dolibarr).`);
    return { added, skipped, contacts: contactsResult, products: productsResult, shipments: shipmentsResult, interventions: interventionsResult };
  }catch(e){
    dolLog('err', 'Échec synchro matin : '+e.message);
    throw e;
  }
}

/* ---- Soir : création/mise à jour d'un tiers Dolibarr pour un contact local ---- */
async function ensureDolibarrThirdParty(contact){
  if(!contact) return null;
  if(contact.dolibarrId) return contact.dolibarrId;
  if(!db.dolibarr.autoCreateThirdParty) throw new Error('Contact "'+contact.nom+'" non lié à Dolibarr (création auto désactivée).');
  const isFournisseur = contact.type==='fournisseur';
  const payload = {
    name: contact.nom || 'Client',
    client: isFournisseur ? 0 : 1,
    fournisseur: isFournisseur ? 1 : 0,
    code_client: isFournisseur ? '' : 'auto',
    code_fournisseur: isFournisseur ? 'auto' : '',
    address: contact.adresse || '',
    zip: contact.codePostal || '',
    town: contact.ville || '',
    phone: contact.tel || '',
    email: contact.email || ''
  };
  const newId = await dolFetch('/thirdparties', { method:'POST', body: payload });
  contact.dolibarrId = String(newId);
  save();
  dolLog('ok', `Tiers Dolibarr créé pour "${contact.nom}" (id ${newId}).`);
  return contact.dolibarrId;
}

/* ---- Envoie vers Dolibarr tous les contacts locaux pas encore liés (nouveaux contacts créés dans le CRM) ---- */
async function syncDolibarrContactsPush(){
  const candidates = db.contacts.filter(c=>!c.dolibarrId && c.nom);
  let created=0, fail=0;
  for(const c of candidates){
    try{ await ensureDolibarrThirdParty(c); created++; }
    catch(e){ fail++; dolLog('err', `Contact "${c.nom}" non créé côté Dolibarr (${e.message}).`); }
  }
  return { created, fail };
}

/* ---- Envoie un rendez-vous créé dans Evidence vers l'agenda Dolibarr (création OU mise à jour) ---- */
async function pushAppointmentToDolibarr(r){
  if(!db.dolibarr.rdvOwnerId) throw new Error(`ID utilisateur Dolibarr propriétaire des RDV non renseigné (Paramètres > Synchronisation Dolibarr).`);
  // date + heure du RDV -> timestamp unix attendu par l'API agendaevents
  const dateStr = `${r.date} ${r.heure||'09:00'}:00`;
  const datep = Math.floor(new Date(dateStr.replace(' ','T')).getTime()/1000);
  if(!datep || isNaN(datep)) throw new Error(`${r.titre||'RDV'} : date/heure invalide, envoi impossible.`);
  let socid = null;
  const contact = db.contacts.find(c=>c.id===r.contactId);
  if(contact){
    try{ socid = await ensureDolibarrThirdParty(contact); }
    catch(e){ dolLog('info', `RDV "${r.titre||r.objet}" : client non lié côté Dolibarr (${e.message}) — le RDV sera quand même créé, sans tiers associé.`); }
  }
  const body = {
    label: (r.titre || r.objet || '').trim() || 'RDV Evidence',
    datep: datep,
    percentage: r.status==='termine' ? 100 : (r.status==='annule' ? -1 : 0),
    note_public: r.notes || '',
    type_code: 'AC_RDV', // l'API Dolibarr attend "type_code" (et non "code") pour le type d'événement d'agenda
    userownerid: Number(db.dolibarr.rdvOwnerId)
  };
  if(socid) body.socid = Number(socid);
  if(r.duree){ body.datef = datep + Number(r.duree)*60; }
  if(r.dolibarrId){
    // RDV déjà lié à Dolibarr : on met à jour l'événement existant plutôt que d'en recréer un
    await dolFetch(`/agendaevents/${r.dolibarrId}`, { method:'PUT', body });
    return r.dolibarrId;
  }
  const newId = await dolFetch('/agendaevents', { method:'POST', body });
  r.dolibarrId = String(newId);
  r.source = r.source || 'evidence';
  r.dolibarrSynced = true;
  r.dolibarrSyncedAt = new Date().toISOString();
  return newId;
}

/* ---- Envoie vers Dolibarr tous les RDV créés localement dans Evidence et pas encore liés ---- */
async function syncDolibarrAppointmentsPush(){
  const candidates = db.appointments.filter(a=>a.source!=='dolibarr' && !a.dolibarrId && a.status!=='termine');
  let created=0, fail=0;
  for(const a of candidates){
    try{ await pushAppointmentToDolibarr(a); created++; }
    catch(e){ fail++; dolLog('err', `RDV "${a.titre||a.objet||'sans titre'}" du ${a.date} non transféré vers Dolibarr (${e.message}).`); }
  }
  // Rattrapage : tout RDV resté en local avec le statut "Terminé" (ex : la modale n'a pas pu le
  // transférer tout de suite, souci réseau...) doit être envoyé/mis à jour côté Dolibarr puis retiré
  // d'Evidence — un RDV terminé ne doit plus vivre ici, seulement dans l'agenda Dolibarr.
  const doneLeftover = db.appointments.filter(a=>a.status==='termine');
  let removedDone=0, doneFail=0;
  for(const a of doneLeftover){
    try{ await pushAppointmentToDolibarr(a); db.appointments = db.appointments.filter(x=>x.id!==a.id); removedDone++; }
    catch(e){ doneFail++; dolLog('err', `RDV terminé "${a.titre||a.objet||'sans titre'}" du ${a.date} non transféré vers Dolibarr, il reste dans Evidence pour l'instant (${e.message}).`); }
  }
  save();
  return { created, fail, removedDone, doneFail };
}

/* ---- Soir : pousse un document (devis/facture) avec ses lignes ---- */
async function pushDocToDolibarr(d){
  const contact = db.contacts.find(c=>c.id===d.contactId);
  if(!contact) throw new Error(`${d.number} : aucun client associé, transfert impossible.`);
  const socid = await ensureDolibarrThirdParty(contact);
  const endpoint = d.type==='devis' ? '/proposals' : '/invoices';
  const header = {
    socid: Number(socid),
    date: Math.floor(new Date(d.date).getTime()/1000),
    note_public: d.notes || '',
    ref_client: d.number
  };
  const newId = await dolFetch(endpoint, { method:'POST', body: header });
  for(const l of (d.lines||[])){
    if(!l.desc && !l.qty && !l.price) continue;
    try{
      await dolFetch(`${endpoint}/${newId}/lines`, { method:'POST', body:{
        desc: l.desc || '', qty: l.qty||0, subprice: l.price||0, tva_tx: l.tva||0
      }});
    }catch(e){ dolLog('err', `${d.number} : ligne "${l.desc}" non transférée (${e.message}).`); }
  }
  if(d.status && d.status!=='brouillon'){
    try{ await dolFetch(`${endpoint}/${newId}/validate`, { method:'POST', body:{} }); }
    catch(e){ dolLog('info', `${d.number} : créé mais non validé côté Dolibarr (${e.message}).`); }
  }
  d.dolibarrId = String(newId);
  d.dolibarrSynced = true;
  d.dolibarrSyncedAt = new Date().toISOString();
  save();
  return newId;
}

/* ---- Liste les fichiers (photos avant/après, signature) d'une intervention pas encore envoyés
   vers Dolibarr, en dédoublonnant sur le nom de fichier grâce à it.dolibarrUploadedFiles. ---- */
function interventionPendingFiles(it){
  const uploaded = new Set(it.dolibarrUploadedFiles || []);
  const files = [];
  ((it.photos && it.photos.avant) || []).forEach((p,i)=>{
    const name = `avant_${i+1}.${dataUrlExt(p)}`;
    if(!uploaded.has(name)) files.push({ name, data:p });
  });
  ((it.photos && it.photos.apres) || []).forEach((p,i)=>{
    const name = `apres_${i+1}.${dataUrlExt(p)}`;
    if(!uploaded.has(name)) files.push({ name, data:p });
  });
  if(it.signatureClient){
    const name = 'signature_client.png';
    if(!uploaded.has(name)) files.push({ name, data: it.signatureClient });
  }
  return files;
}

/* ---- Une intervention doit repartir en synchro soir si : elle n'a encore jamais été créée côté
   Dolibarr, OU son statut local a changé depuis le dernier envoi, OU elle a des photos/signature
   pas encore déposées sur la fiche Dolibarr. Avant ce correctif, seul le filtre "date du jour +
   jamais synchronisée" était utilisé : une fois dolibarrSynced=true (y compris pour les fiches
   importées DEPUIS Dolibarr), plus aucun changement local (statut "traitée", photos ajoutées...)
   n'était jamais renvoyé. ---- */
function interventionNeedsPush(it){
  if(!it.dolibarrId) return true;
  if(it.status !== it.dolibarrLastPushedStatus) return true;
  return interventionPendingFiles(it).length > 0;
}

/* ---- Soir : pousse une intervention (fiche d'intervention Dolibarr) — crée la fiche si elle
   n'existe pas encore côté Dolibarr, puis (que ce soit à la création ou sur une fiche déjà liée,
   y compris importée depuis Dolibarr) répercute le statut local et dépose les photos/signature
   pas encore envoyées. ---- */
async function pushInterventionToDolibarr(it){
  let newId = it.dolibarrId;
  let dolRef = it.dolibarrRef;

  if(!newId){
    const contact = db.contacts.find(c=>c.id===it.contactId);
    if(!contact) throw new Error(`${it.number} : aucun client associé, transfert impossible.`);
    const socid = await ensureDolibarrThirdParty(contact);
    const totals = interventionTotals(it);
    const detailLines = (it.lines||[]).map(l=>`- ${l.desc} x${l.qty} @ ${fmtMoney(l.price)}`).join('\n');
    const header = {
      socid: Number(socid),
      date_create: Math.floor(new Date(it.date).getTime()/1000),
      description: [
        it.description||'',
        it.technicien? 'Technicien : '+it.technicien : '',
        detailLines,
        totals.ttc ? 'Total TTC pièces/prestations : '+fmtMoney(totals.ttc) : ''
      ].filter(Boolean).join('\n'),
      note_public: it.notes || '',
      ref_client: it.number
    };
    newId = await dolFetch('/interventions', { method:'POST', body: header });
    try{
      await dolFetch(`/interventions/${newId}/lines`, { method:'POST', body:{
        desc: it.description || it.number,
        duration: Math.round((it.dureeHeures||0)*3600),
        date: Math.floor(new Date(it.date).getTime()/1000)
      }});
    }catch(e){ dolLog('info', `${it.number} : ligne de durée non ajoutée (${e.message}).`); }
    it.dolibarrId = String(newId);
    it.dolibarrSynced = true;
    it.dolibarrSyncedAt = new Date().toISOString();
    save();
  }

  // Récupère la référence Dolibarr (ex: FI2508-0001), nécessaire pour déposer les pièces jointes
  // au bon endroit — l'upload par id brut ne fonctionne pas sur toutes les versions de Dolibarr.
  if(!dolRef){
    try{
      const detail = await dolFetch(`/interventions/${newId}`);
      if(detail && detail.ref) dolRef = detail.ref;
    }catch(e){ /* on retentera avec l'id brut si besoin */ }
    if(!dolRef) dolRef = String(newId);
    it.dolibarrRef = dolRef;
  }

  // Répercute le statut local (planifiée / terminée) sur la fiche Dolibarr — sans ça une
  // intervention marquée "traitée" dans Evidence restait indéfiniment ouverte côté Dolibarr.
  if(it.status !== it.dolibarrLastPushedStatus){
    try{
      if(it.status==='terminee'){
        try{ await dolFetch(`/interventions/${newId}/close`, { method:'POST', body:{} }); }
        catch(e){ await dolFetch(`/interventions/${newId}`, { method:'PUT', body:{ statut:2 } }); }
      } else {
        await dolFetch(`/interventions/${newId}`, { method:'PUT', body:{ statut:1 } });
      }
      it.dolibarrLastPushedStatus = it.status;
      save();
    }catch(e){ dolLog('info', `${it.number} : statut non répercuté sur Dolibarr (${e.message}).`); }
  }

  // Dépose les photos avant/après et la signature pas encore envoyées sur la fiche Dolibarr.
  const pending = interventionPendingFiles(it);
  if(pending.length){
    it.dolibarrUploadedFiles = it.dolibarrUploadedFiles || [];
    for(const f of pending){
      try{
        await uploadDolibarrDocument(dolRef, f.name, f.data, 'ficheinter');
        it.dolibarrUploadedFiles.push(f.name);
      }catch(e){ dolLog('err', `${it.number} : pièce jointe "${f.name}" non envoyée sur la fiche Dolibarr (${e.message}).`); }
    }
    save();
  }

  return newId;
}

/* ---- Soir : répercute sur Dolibarr le paiement d'une facture marquée "Payé" dans Evidence.
   Sans ça, une facture créée puis payée dans Evidence restait indéfiniment "impayée" côté
   Dolibarr, car pushDocToDolibarr ne fait que créer/valider la facture une seule fois — il ne
   renvoie jamais les changements de statut ultérieurs. On enregistre ici un vrai règlement
   Dolibarr (endpoint /invoices/{id}/payments), ce qui exige un mode de paiement et un compte
   bancaire Dolibarr valides (configurables dans Paramètres > Synchronisation Dolibarr). ---- */
async function pushInvoicePaymentToDolibarr(d){
  if(!d.dolibarrId) throw new Error(`${d.number} : facture non encore transférée vers Dolibarr, impossible d'y déposer un règlement.`);
  if(!db.dolibarr.paymentModeId) throw new Error(`${d.number} : ID du mode de paiement Dolibarr non renseigné (Paramètres > Synchronisation Dolibarr).`);
  if(!db.dolibarr.bankAccountId) throw new Error(`${d.number} : ID du compte bancaire Dolibarr non renseigné (Paramètres > Synchronisation Dolibarr).`);
  // On vérifie d'abord l'état réel de la facture côté Dolibarr : si elle y est déjà soldée (reste à
  // payer = 0), on ne tente pas d'y ajouter un règlement — Dolibarr refuse un paiement de 0€ avec
  // l'erreur "TotalAmountEmpty". On se contente alors de marquer la synchro comme faite. Ce cas est
  // fréquent pour les factures importées depuis l'historique Dolibarr, déjà payées avant même d'avoir
  // été marquées "Payé" dans Evidence.
  let remote;
  try{ remote = await dolFetch(`/invoices/${d.dolibarrId}`); }
  catch(e){
    if(/not found/i.test(e.message)){
      throw new Error(`${d.number} : la facture liée (id Dolibarr ${d.dolibarrId}) n'existe plus/pas côté Dolibarr — lien de synchro invalide. Vérifie côté Dolibarr, ou supprime puis renvoie cette facture pour la relier à une nouvelle.`);
    }
    throw e;
  }
  const alreadyPaid = Number(remote.paye)===1 || Number(remote.statut)===2;
  if(alreadyPaid){
    d.dolibarrLastPushedStatus = d.status;
    d.dolibarrPaymentSyncedAt = new Date().toISOString();
    save();
    return { alreadyPaid: true };
  }
  const body = {
    datepaye: Math.floor(Date.now()/1000),
    paymentid: Number(db.dolibarr.paymentModeId),
    closepaidinvoices: 'yes',
    accountid: Number(db.dolibarr.bankAccountId)
  };
  await dolFetch(`/invoices/${d.dolibarrId}/payments`, { method:'POST', body });
  d.dolibarrLastPushedStatus = d.status;
  d.dolibarrPaymentSyncedAt = new Date().toISOString();
  save();
  return { alreadyPaid: false };
}

/* ---- Soir : pousse un bon de livraison ----
   Dolibarr n'autorise pas la création d'une expédition "toute seule" : son API exige
   une commande d'origine (origin_id/origin_type) et un entrepôt par ligne (entrepot_id).
   On crée donc automatiquement une commande Dolibarr minimale à partir du BL local,
   puis l'expédition liée à cette commande. Nécessite les modules "Commandes" et
   "Expéditions" activés côté Dolibarr, ainsi qu'un ID d'entrepôt renseigné (Paramètres). */
async function pushBLToDolibarr(d){
  const contact = db.contacts.find(c=>c.id===d.contactId);
  if(!contact) throw new Error(`${d.number} : aucun client associé, transfert impossible.`);
  if(!db.dolibarr.warehouseId) throw new Error(`${d.number} : ID d'entrepôt Dolibarr non renseigné (Paramètres > Synchronisation Dolibarr).`);
  const socid = await ensureDolibarrThirdParty(contact);

  const usableLines = (d.lines||[]).filter(l=>l.desc||l.qty||l.price);
  const orderLines = usableLines.map(l=>({
    desc: l.desc || '', subprice: l.price || 0, qty: l.qty || 0, tva_tx: l.tva || 0
  }));
  const orderHeader = {
    socid: Number(socid),
    date: Math.floor(new Date(d.date).getTime()/1000),
    note_public: d.notes || '',
    ref_client: d.number,
    lines: orderLines
  };
  const orderId = await dolFetch('/orders', { method:'POST', body: orderHeader });

  // on récupère les ids de lignes de la commande pour les relier à l'expédition
  let orderLineIds = [];
  try{
    const orderDetail = await dolFetch(`/orders/${orderId}`);
    orderLineIds = (orderDetail.lines||[]).map(l=>l.id || l.rowid);
  }catch(e){ dolLog('info', `${d.number} : lignes de commande non relues (${e.message}), l'expédition sera créée sans lien de ligne précis.`); }

  try{ await dolFetch(`/orders/${orderId}/validate`, { method:'POST', body:{} }); }
  catch(e){ dolLog('info', `${d.number} : commande Dolibarr créée mais non validée (${e.message}).`); }

  const shipLines = orderLines.map((l,i)=>({
    entrepot_id: Number(db.dolibarr.warehouseId),
    fk_element: orderId,
    origin_id: orderId,
    fk_elementdet: orderLineIds[i],
    origin_line_id: orderLineIds[i],
    element_type: 'order',
    origin_type: 'commande',
    qty: l.qty || 0
  }));
  const shipHeader = {
    socid: Number(socid),
    origin_id: orderId,
    origin_type: 'commande',
    date_delivery: d.dateLivraisonPrevue ? Math.floor(new Date(d.dateLivraisonPrevue).getTime()/1000) : Math.floor(new Date(d.date).getTime()/1000),
    note_public: [d.notes, d.transporteur?('Transporteur : '+d.transporteur):'', d.adresseLivraison?('Adresse de livraison : '+d.adresseLivraison):''].filter(Boolean).join('\n'),
    ref_client: d.number,
    tracking_number: d.numeroSuivi || '',
    lines: shipLines
  };
  const shipId = await dolFetch('/shipments', { method:'POST', body: shipHeader });
  if(d.status && d.status!=='brouillon'){
    try{ await dolFetch(`/shipments/${shipId}/validate`, { method:'POST', body:{} }); }
    catch(e){ dolLog('info', `${d.number} : expédition créée mais non validée (${e.message}).`); }
  }
  d.dolibarrOrderId = String(orderId);
  d.dolibarrId = String(shipId);
  d.dolibarrSynced = true;
  d.dolibarrSyncedAt = new Date().toISOString();
  save();

  // ---- Référence Dolibarr de l'expédition (pour les dépôts de documents) ----
  let dolRef = String(shipId);
  try{
    const shipDetail = await dolFetch(`/shipments/${shipId}`);
    if(shipDetail && shipDetail.ref) dolRef = shipDetail.ref;
  }catch(e){ dolLog('info', `${d.number} : référence Dolibarr de l'expédition non relue (${e.message}), dépôt tenté avec l'id brut.`); }
  d.dolibarrRef = dolRef;
  save();

  // ---- Preuve de livraison + statut (livrée/refusée/reportée) répercutés sur l'expédition ----
  try{
    await pushDeliveryProofToDolibarr(d);
    dolLog('ok', `${d.number} : preuve de livraison déposée sur l'expédition Dolibarr ${dolRef}.`);
  }catch(e){ dolLog('err', `${d.number} : ${e.message}`); }
  return shipId;
}

/* ---- Dolibarr ne connaît nativement que 3 statuts d'expédition (Brouillon / Validée / Clôturée) :
   il n'existe pas de statut "Refusée" ni "Absent". On répercute donc le vrai dénouement de la
   livraison dans le champ complémentaire (extrafield) "statut_reel_livraison" créé sur les
   expéditions Dolibarr (valeurs possibles : livree / refusee / absente / reportee), en plus de la
   note publique. C'est ce champ qu'il faut afficher/filtrer côté Dolibarr pour voir le vrai statut. ---- */
async function pushDolibarrDeliveryExtrafield(dolibarrId, code){
  await dolFetch(`/shipments/${dolibarrId}`, { method:'PUT', body:{
    array_options: { options_statut_reel_livraison: code }
  } });
}

/* ---- Répercute sur Dolibarr le dénouement d'une livraison (colis déjà lié à une expédition
   Dolibarr, créée localement ou importée) dès que son statut passe à Livrée / Refusée / Absent /
   Reportée : dépose la signature + la preuve de livraison PDF, clôture l'expédition si livrée, ou
   dépose une note explicite + le statut réel si refusée/absent/reportée. Se redéclenche à chaque
   nouveau changement de statut (comparaison via dolibarrLastPushedStatus), pas seulement le jour même. ---- */
async function pushDeliveryProofToDolibarr(d){
  if(!d.dolibarrId) throw new Error(`${d.number} : aucune expédition Dolibarr liée.`);
  const dolRef = d.dolibarrRef || String(d.dolibarrId);
  const errors = [];

  if(d.signatureClient){
    try{ await uploadDolibarrDocument(dolRef, 'signature_client.png', d.signatureClient, 'shipment'); }
    catch(e){ errors.push('signature'); dolLog('err', `${d.number} : signature client non déposée sur l'expédition Dolibarr (${e.message}).`); }
  }
  if(d.photoLivraison){
    try{ await uploadDolibarrDocument(dolRef, 'photo_livraison_'+d.number+'.jpg', d.photoLivraison, 'shipment'); }
    catch(e){ errors.push('photo'); dolLog('err', `${d.number} : photo de livraison non déposée sur l'expédition Dolibarr (${e.message}).`); }
  }
  try{
    const proofDataUrl = exportDocPdf(d, 'a4', { returnDataUrl:true });
    await uploadDolibarrDocument(dolRef, 'preuve_livraison_'+d.number+'.pdf', proofDataUrl, 'shipment');
  }catch(e){ errors.push('PDF de preuve'); dolLog('err', `${d.number} : preuve de livraison non déposée sur l'expédition Dolibarr (${e.message}).`); }

  // tentative de clôture de l'expédition côté Dolibarr (endpoint variable selon versions)
  if(d.status==='paye'){
    try{
      // Dolibarr n'autorise le passage "Clôturée / Expédiée" (close) que si l'expédition a déjà
      // été validée côté Dolibarr (statut "Validée", pas "Brouillon"). On s'en assure avant de
      // tenter la clôture, sinon Dolibarr refuse l'appel sans forcément le dire clairement.
      let shipStatus = null;
      try{
        const shipNow = await dolFetch(`/shipments/${d.dolibarrId}`);
        shipStatus = shipNow ? Number(shipNow.status ?? shipNow.statut) : null;
      }catch(e){ /* on tentera la clôture quand même */ }
      if(shipStatus === 0){
        try{ await dolFetch(`/shipments/${d.dolibarrId}/validate`, { method:'POST', body:{} }); }
        catch(e){ dolLog('err', `${d.number} : impossible de valider l'expédition Dolibarr avant clôture (${e.message}).`); }
      }
      await dolFetch(`/shipments/${d.dolibarrId}/close`, { method:'POST', body:{ notrigger:0 } });
      dolLog('ok', `${d.number} : expédition Dolibarr clôturée (statut "Livrée/Expédiée").`);
      try{ await pushDolibarrDeliveryExtrafield(d.dolibarrId, 'livree'); }
      catch(e){ dolLog('err', `${d.number} : statut réel "livrée" non écrit dans le champ complémentaire Dolibarr (${e.message}).`); }
    }catch(e){
      let hint = '';
      if(/403/.test(e.message)) hint = " — vérifie que l'utilisateur de la clé API a le droit « Expéditions → Créer/Modifier » (pas seulement Lire).";
      else if(/304/.test(e.message)) hint = ' — l\'expédition est peut-être déjà clôturée côté Dolibarr.';
      errors.push('statut "livrée"');
      dolLog('err', `${d.number} : expédition Dolibarr non clôturée (${e.message})${hint}`);
    }
  } else if(d.status==='refuse'){
    // Statut "Refusée" inexistant nativement dans Dolibarr : on écrit le vrai statut dans le champ
    // complémentaire "statut_reel_livraison" (visible/filtrable sur la fiche et la liste des
    // expéditions), en plus de la note publique pour garder une trace lisible.
    try{
      await dolFetch(`/shipments/${d.dolibarrId}`, { method:'PUT', body:{
        note_public: `LIVRAISON REFUSÉE par le client${d.motifRefus?(' — Motif : '+d.motifRefus):''}${d.dateLivraisonReelle?(' (le '+fmtDate(d.dateLivraisonReelle)+')'):''}.`,
        array_options: { options_statut_reel_livraison: 'refusee' }
      } });
      dolLog('ok', `${d.number} : refus de livraison tracé sur l'expédition Dolibarr (note + statut réel "refusée").`);
    }catch(e){ errors.push('statut "refusée"'); dolLog('err', `${d.number} : refus non déposé sur Dolibarr (${e.message}).`); }
  } else if(d.status==='absent'){
    // Statut "Absent" inexistant nativement dans Dolibarr : même principe que "refuse", avec le
    // code "absente" dans le champ complémentaire.
    try{
      await dolFetch(`/shipments/${d.dolibarrId}`, { method:'PUT', body:{
        note_public: `CLIENT ABSENT lors de la livraison${d.motifRefus?(' — Note : '+d.motifRefus):''}${d.dateLivraisonReelle?(' (le '+fmtDate(d.dateLivraisonReelle)+')'):''}.`,
        array_options: { options_statut_reel_livraison: 'absente' }
      } });
      dolLog('ok', `${d.number} : absence du client tracée sur l'expédition Dolibarr (note + statut réel "absente").`);
    }catch(e){ errors.push('statut "absente"'); dolLog('err', `${d.number} : absence non déposée sur Dolibarr (${e.message}).`); }
  } else if(d.status==='reporte'){
    try{
      const body = {
        note_public: `Livraison reportée${d.dateLivraisonPrevue?(' au '+fmtDate(d.dateLivraisonPrevue)):''}.`,
        array_options: { options_statut_reel_livraison: 'reportee' }
      };
      if(d.dateLivraisonPrevue) body.date_delivery = Math.floor(new Date(d.dateLivraisonPrevue).getTime()/1000);
      await dolFetch(`/shipments/${d.dolibarrId}`, { method:'PUT', body });
      dolLog('ok', `${d.number} : report de livraison répercuté sur l'expédition Dolibarr (note + statut réel "reportée").`);
    }catch(e){ errors.push('statut "reportée"'); dolLog('err', `${d.number} : report non répercuté sur Dolibarr (${e.message}).`); }
  }

  d.dolibarrProofSyncedAt = new Date().toISOString();
  if(errors.length){
    // Échec partiel ou total : on NE marque PAS ce statut comme "poussé", pour que la prochaine
    // synchro (soir suivant, ou bouton "Renvoyer maintenant") retente automatiquement — sinon la
    // livraison resterait bloquée indéfiniment alors que rien n'est réellement arrivé sur Dolibarr.
    d.dolibarrProofSynced = false;
    d.dolibarrProofSyncError = `Échec sur : ${errors.join(', ')}.`;
    save();
    throw new Error(`${d.number} : synchro Dolibarr incomplète (${errors.join(', ')}) — sera retentée automatiquement.`);
  }
  d.dolibarrProofSynced = true;
  d.dolibarrProofSyncError = null;
  d.dolibarrLastPushedStatus = d.status;
  save();
  return true;
}

/* ---- Matin : importe depuis Dolibarr tous les colis mis "en expédition" (nouvelles livraisons
   à faire du jour, créées côté Dolibarr la veille au soir), et rafraîchit ceux déjà connus ici. ---- */
async function syncDolibarrShipmentsPull(){
  dolLog('info', `Synchro livraisons — récupération des expéditions Dolibarr...`);
  try{
    let all = [];
    let page = 0;
    const limit = 200;
    while(true){
      const batch = await dolFetch(`/shipments?sortfield=t.rowid&sortorder=DESC&limit=${limit}&page=${page}`);
      const arr = Array.isArray(batch) ? batch : [];
      all = all.concat(arr);
      if(arr.length < limit) break;
      page++;
      if(page>20) break; // sécurité anti-boucle
    }
    let added=0, updated=0;
    for(const sh of all){
      if(!sh || !sh.id) continue;
      // on retrouve d'abord le colis via l'ID Dolibarr déjà lié, sinon via le n° de suivi
      // (cas d'un colis créé/scanné ici avant d'être poussé côté Dolibarr) pour éviter les doublons.
      let existing = db.documents.find(d=>d.type==='bl' && d.dolibarrId===String(sh.id));
      if(!existing && sh.tracking_number){
        existing = db.documents.find(d=>d.type==='bl' && !d.dolibarrId && d.numeroSuivi && d.numeroSuivi===sh.tracking_number);
      }
      const c = sh.socid ? db.contacts.find(c=>c.dolibarrId===String(sh.socid)) : null;
      const { date: dateLivPrevue } = dolUnixToISO(sh.date_delivery || sh.date_shipping || sh.date_creation);
      const shLines = (Array.isArray(sh.lines) ? sh.lines : []).map(l=>({
        desc: l.product_label || l.label || l.desc || l.libelle || 'Article', qty: Number(l.qty)||0, price:0, tva:0
      }));

      if(existing){
        if(!existing.dolibarrId){
          // lien établi via le n° de suivi : on l'enregistre pour que les prochaines synchros
          // matchent directement par ID Dolibarr.
          existing.dolibarrId = String(sh.id);
          existing.dolibarrRef = sh.ref || String(sh.id);
          updated++;
          dolLog('ok', `${existing.number} : lié à l'expédition Dolibarr ${sh.ref||sh.id} via le n° de suivi ${sh.tracking_number}.`);
        }
        // on ne réimporte pas par-dessus une livraison déjà finalisée localement (livrée, refusée ou absent)
        if(!['paye','refuse','absent'].includes(existing.status)){
          if(sh.tracking_number && sh.tracking_number!==existing.numeroSuivi){ existing.numeroSuivi = sh.tracking_number; updated++; }
          if(dateLivPrevue && dateLivPrevue!==existing.dateLivraisonPrevue){ existing.dateLivraisonPrevue = dateLivPrevue; updated++; }
        }
        continue;
      }

      const doc = {
        id: uid(), type:'bl', number: sh.ref || nextNumber('bl'),
        date: todayISO(), contactId: c ? c.id : '', clientLabel: (sh.thirdparty && sh.thirdparty.name) || sh.socname || '',
        status: 'envoye', // "En livraison" côté BL — colis mis en expédition dans Dolibarr, pas encore livré
        source: 'dolibarr',
        transporteur: sh.tracking_url ? '' : (sh.shipping_method_id ? 'Transporteur Dolibarr #'+sh.shipping_method_id : ''),
        numeroSuivi: sh.tracking_number || '',
        dateLivraisonPrevue: dateLivPrevue || '',
        dateLivraisonReelle: '',
        adresseLivraison: '',
        notes: sh.note_public || '',
        lines: shLines.length ? shLines : [{desc:'Colis '+(sh.ref||sh.id), qty:1, price:0, tva:0}],
        dolibarrId: String(sh.id),
        dolibarrRef: sh.ref || String(sh.id),
        dolibarrOrderId: sh.origin_id ? String(sh.origin_id) : '',
        dolibarrSynced: true,
        dolibarrSyncedAt: new Date().toISOString()
      };
      db.documents.push(doc);
      added++;
    }
    save();
    db.dolibarr.lastShipmentsPull = new Date().toISOString();
    save();
    dolLog('ok', `Synchro livraisons terminée : ${added} nouvelle(s) livraison(s) importée(s), ${updated} mise(s) à jour.`);
    return { added, updated };
  }catch(e){
    dolLog('err', 'Échec synchro livraisons : '+e.message);
    throw e;
  }
}

/* ---- Interventions : import des fiches d'intervention créées côté Dolibarr (agents, autre
   utilisateur, mobile Dolibarr, etc.) vers Evidence. Symétrique de pushInterventionToDolibarr,
   qui ne fait que l'envoi Evidence → Dolibarr et ne remonte donc jamais ce qui est créé côté
   Dolibarr — d'où l'absence totale d'import observée jusqu'ici. ---- */
async function syncDolibarrInterventionsPull(){
  dolLog('info', `Synchro interventions — récupération des fiches Dolibarr...`);
  try{
    let all = [];
    let page = 0;
    const limit = 200;
    while(true){
      const batch = await dolFetch(`/interventions?sortfield=t.rowid&sortorder=DESC&limit=${limit}&page=${page}`);
      const arr = Array.isArray(batch) ? batch : [];
      all = all.concat(arr);
      if(arr.length < limit) break;
      page++;
      if(page>20) break; // sécurité anti-boucle
    }
    let added=0, updated=0;
    for(const fi of all){
      if(!fi || !fi.id) continue;
      const existing = db.interventions.find(i=>i.dolibarrId===String(fi.id));
      const c = fi.socid ? db.contacts.find(c=>c.dolibarrId===String(fi.socid)) : null;
      const { date } = dolUnixToISO(fi.date_create || fi.datec || fi.date);
      // Durée : on additionne la durée (en secondes) de toutes les lignes de la fiche, si présentes.
      const fiLines = Array.isArray(fi.lines) ? fi.lines : [];
      const dureeSec = fiLines.reduce((s,l)=> s + (Number(l.duration)||0), 0);
      const dureeHeures = dureeSec ? Math.round((dureeSec/3600)*100)/100 : (Number(fi.duration)||0)/3600 || 0;
      const linesMapped = fiLines.map(l=>({
        desc: l.desc || l.description || 'Prestation', qty:1, price:0, tva:0
      }));

      if(existing){
        // on ne réimporte pas par-dessus une intervention déjà terminée localement, pour ne pas
        // écraser les photos/signature/notes déjà saisies sur le terrain.
        if(existing.status==='terminee') continue;
        let changed = false;
        if(fi.ref && fi.ref!==existing.dolibarrRef){ existing.dolibarrRef = fi.ref; changed = true; }
        if(fi.note_public && fi.note_public!==existing.notes){ existing.notes = fi.note_public; changed = true; }
        if(changed){ updated++; }
        continue;
      }

      const it = {
        id: uid(),
        number: fi.ref || interventionNextNumber(),
        contactId: c ? c.id : '',
        date: date || todayISO(),
        heure: '09:00',
        technicien: fi.fk_user_author_name || fi.user_author || '',
        description: fi.description || fi.note_private || (fi.ref ? 'Intervention '+fi.ref : 'Intervention Dolibarr'),
        dureeHeures: dureeHeures || 0,
        status: fi.statut>=2 ? 'terminee' : 'planifiee',
        notes: fi.note_public || '',
        lines: linesMapped,
        photos:{ avant:[], apres:[] },
        signatureClient: null,
        source: 'dolibarr',
        dolibarrId: String(fi.id),
        dolibarrRef: fi.ref || String(fi.id),
        dolibarrSynced: true,
        dolibarrSyncedAt: new Date().toISOString(),
        dolibarrLastPushedStatus: fi.statut>=2 ? 'terminee' : 'planifiee',
        dolibarrUploadedFiles: []
      };
      db.interventions.push(it);
      added++;
    }
    save();
    db.dolibarr.lastInterventionsPull = new Date().toISOString();
    save();
    dolLog('ok', `Synchro interventions terminée : ${added} nouvelle(s) intervention(s) importée(s), ${updated} mise(s) à jour.`);
    return { added, updated };
  }catch(e){
    dolLog('err', 'Échec synchro interventions : '+e.message);
    throw e;
  }
}

function dataUrlToBase64(dataUrl){
  if(!dataUrl) return null;
  const idx = dataUrl.indexOf(',');
  return idx>=0 ? dataUrl.slice(idx+1) : dataUrl;
}
function dataUrlExt(dataUrl){
  const m = /^data:image\/(\w+);/.exec(dataUrl||'');
  const ext = m ? m[1] : 'jpg';
  return ext==='jpeg' ? 'jpg' : ext;
}
async function uploadDolibarrDocument(ref, filename, dataUrl, modulepart){
  const b64 = dataUrlToBase64(dataUrl);
  if(!b64) return;
  const mp = modulepart || 'contrat';
  try{
    return await dolFetch('/documents/upload', { method:'POST', body:{
      filename, modulepart: mp, ref, subdir:'', filecontent:b64, fileencoding:'base64', overwriteifexists:'1'
    }});
  }catch(e){
    // Sur certaines versions de Dolibarr, l'endpoint POST /documents/upload ne sait pas encore
    // retrouver le dossier d'une expédition à partir de sa seule référence ("ref") : il répond
    // "Modulepart shipment not implemented yet." On retente alors en visant directement le
    // sous-dossier physique de l'expédition (subdir), qui passe par le contrôle d'accès générique
    // de Dolibarr et fonctionne sur toutes les versions — c'est ce même dossier qu'affiche l'onglet
    // « Fichiers et documents joints » de la fiche expédition.
    if(/not implemented yet/i.test(e.message||'') && (mp==='shipment' || mp==='expedition')){
      const safeRef = String(ref||'').trim().replace(/[\\/]+/g,'_');
      if(!safeRef) throw e;
      return dolFetch('/documents/upload', { method:'POST', body:{
        filename, modulepart:'expedition', ref:'', subdir:`sending/${safeRef}`, filecontent:b64, fileencoding:'base64', overwriteifexists:'1'
      }});
    }
    throw e;
  }
}
